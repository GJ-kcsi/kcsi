.back{background:transparent;border:1px solid rgba(255,255,255,.4);color:inherit;font:inherit;border-radius:8px;padding:4px 10px}

.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.panel h2{margin:0;font-size:15px;color:var(--navy)}
details.acc{display:block;padding:0}
details.acc>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:14px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary h2{flex:1}
details.acc>summary .cnt{font-size:13px;color:var(--muted);white-space:nowrap}
details.acc>summary .cnt.on{color:var(--navy);font-weight:600}
details.acc>summary::after{content:"›";font-size:20px;color:var(--muted);transform:rotate(90deg);transition:transform .15s}
details.acc[open]>summary::after{transform:rotate(-90deg)}
details.acc .body{display:grid;gap:10px;padding:0 12px 12px}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panel h2{color:var(--accent)}}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=datetime-local],input[type=number],textarea,select{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);color:var(--ink);font:inherit;padding:9px 0}
.seg button[aria-pressed=true]{background:var(--on);color:var(--on-ink);font-weight:700}
.q{display:grid;gap:6px}
.q > span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.sysrow{display:flex;gap:6px;align-items:center}.sysrow input{flex:1}.sysrow .chips{flex-wrap:nowrap;gap:4px}.sysrow .chip{padding:6px 9px;font-size:13px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px}
.chip[aria-pressed=true]{background:var(--on);color:var(--on-ink);border-color:var(--on);font-weight:700}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:11px 12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.small{padding:6px 10px;font-size:13px;white-space:nowrap;flex:none}
.btn:disabled{opacity:.5}
.btn:focus-visible,.icon:focus-visible,.chip:focus-visible,.seg button:focus-visible,.menu:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);font:inherit;cursor:pointer}
.menu b{font-size:16px;display:block}
.menu small{color:var(--muted)}
.menu .n{font-size:22px;font-weight:800;color:var(--navy);width:34px;text-align:center}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .menu .n{color:var(--accent)}}
.inc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.inc input{width:20px;height:20px}
.empty{text-align:center;color:var(--muted);padding:24px 10px;border:1.5px dashed var(--line);border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:104px 1fr;gap:10px}
.thumb{width:104px;height:78px;border-radius:6px;background:var(--chip);object-fit:contain;display:block}
.meta{min-width:0;display:grid;gap:6px;align-content:start}
.top{display:flex;align-items:center;gap:6px}
.no{font-weight:700;color:var(--navy);white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .no{color:var(--accent)}}
.tools{margin-left:auto;display:flex;gap:4px}
.icon{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;display:grid;place-items:center;padding:0}
.icon.del{color:var(--danger)}
.card .full{grid-column:1/-1}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:-6px}
.count.over{color:var(--danger);font-weight:700}
.pad{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;touch-action:none}
.pad canvas{display:block;width:100%;height:auto}
.padtools{display:flex;gap:6px;flex-wrap:wrap}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
footer.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:5;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.dock .btn{flex:1;color:#fff;border:0}
#saveDock{background:#1F3A5F}#makeHwpx{background:#2F6FB5}#make{background:#B23A3A}
.dock .info{font-size:13px;color:var(--muted);flex:1;min-width:0;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sheet{position:fixed;inset:0;background:rgba(10,16,22,.5);display:grid;align-items:end;z-index:10}
.sheet .box{background:var(--card);border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;max-width:760px;width:100%;margin:0 auto}
.sheet h2{margin:0;font-size:17px}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.progress{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent)}
.brand{text-align:center;color:var(--muted);font-size:11px;line-height:1.6;padding:14px 0 4px;border-top:1px solid var(--line);margin-top:6px}
.brand .mark{display:flex;justify-content:center;align-items:baseline;gap:6px;margin-bottom:2px}
.brand .mark b{font-size:14px;color:var(--navy);letter-spacing:.02em}
.brand .mark span{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:0 7px}
.brand .org{font-size:12px;font-weight:700;color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .mark b{color:var(--accent)}}
.inst{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px}
.inst h3{margin:0;font-size:14px;color:var(--muted)}
.inst ol{margin:0;padding-left:22px;display:grid;gap:3px;font-size:15px}
.inst.mine{border-color:var(--accent);border-width:2px}
.topbtns{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.topbtns .btn{padding:10px 4px;font-size:14px;white-space:nowrap}
.skx{position:fixed;inset:0;z-index:20;background:#2b3138;display:flex;flex-direction:column}
.skx .tb{display:flex;gap:6px;padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px));background:#1f3a5f;overflow-x:auto;flex:none}
.skx .tb button{flex:none;font:inherit;font-size:14px;border:1px solid rgba(255,255,255,.35);background:transparent;color:#fff;border-radius:8px;padding:7px 11px;white-space:nowrap}
.skx .tb button[aria-pressed=true]{background:#ffb000;color:#1b1b1b;border-color:#ffb000;font-weight:700}
.skx .tb .sep{flex:none;width:1px;background:rgba(255,255,255,.3);margin:2px 2px}
.skx .tb .done{margin-left:auto;background:#fff;color:#1f3a5f;font-weight:700}
.skx .tb .hide{display:none}
.skx .tb .sigt{flex:none;color:#fff;font-weight:700;align-self:center;padding:0 6px}
.skx .area{flex:1;display:grid;place-items:center;min-height:0;padding:6px}
.skx canvas{background:#fff;touch-action:none;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.pad.open{cursor:pointer}
.legal{font-size:11px;color:var(--muted);text-align:center}
.hide{display:none!important}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="bar">
  <button id="back" class="back hide" type="button">← 처음</button>
  <h1 id="title">KCSI Photo Editor</h1>
</div></header>

<main id="view"></main>

<footer class="dock"><div class="in">
  <div class="info hide" id="info"></div>
  <button id="saveDock" class="btn primary" type="button">저장</button>
  <button id="makeHwpx" class="btn primary" type="button">HWPX</button>
  <button id="make" class="btn primary" type="button">PDF</button>
</div></footer>

<input id="pick" type="file" accept="image/*" multiple hidden>
<input id="pickDoc" type="file" accept="image/*" multiple hidden>
<input id="openKcsi" type="file" hidden>

<div id="install" class="sheet hide" role="dialog" aria-modal="true" aria-labelledby="installTitle">
  <div class="box">
    <div style="display:flex;gap:12px;align-items:center">
      <img id="installIcon" alt="" width="56" height="56" style="border-radius:12px;flex:none">
      <h2 id="installTitle">앱으로 설치하기</h2>
    </div>
    <div id="instInApp" class="hide" style="display:grid;gap:6px">
      <p style="color:var(--ink);font-size:15px;margin:0">지금은 카카오톡 등 다른 앱 안에서 열려 있어 설치가 되지 않습니다.</p>
      <ol style="margin:0;padding-left:22px;display:grid;gap:4px;font-size:15px">
        <li>오른쪽 위(또는 아래) 메뉴(⋮)를 누릅니다.</li><li>‘다른 브라우저로 열기’를 누릅니다.</li><li>새로 열린 화면에서 설치합니다.</li></ol>
    </div>
    <section id="instAndroid" class="inst">
      <h3>안드로이드 (갤럭시 등)</h3>
      <button id="installBtn" class="btn primary" type="button">설치하기</button>
      <ol id="instAndroidSteps" class="hide"></ol>
    </section>
    <section id="instIOS" class="inst">
      <h3>아이폰</h3>
      <ol><li>사파리 아래쪽 <b>공유 버튼(□↑)</b>을 누릅니다.</li><li>목록을 내려 <b>‘홈 화면에 추가’</b>를 누릅니다.</li><li>오른쪽 위 <b>‘추가’</b>를 누릅니다.</li></ol>
    </section>
    <div class="two">
      <button id="installLater" class="btn" type="button">나중에</button>
      <button id="installNever" class="btn" type="button">다시 보지 않기</button>
    </div>
  </div>
</div>

<div id="sheet" class="sheet hide" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="box">
    <h2 id="sheetTitle"></h2>
    <p id="sheetMsg"></p>
    <div class="progress" id="prog"><i></i></div>
    <div id="sheetBtns" class="two hide">
      <button id="save" class="btn primary" type="button">저장</button>
      <button id="close2" class="btn" type="button">닫기</button>
    </div>
    <div id="nameBox" class="hide" style="display:grid;gap:10px">
      <div style="display:flex;align-items:center;gap:6px"><input id="fname" type="text" autocomplete="off" style="flex:1"><span id="fext"></span></div>
      <div class="two"><button id="nameOk" class="btn primary" type="button">저장</button><button id="nameNo" class="btn" type="button">취소</button></div>
    </div>
    <div id="confirmBtns" class="two hide">
      <button id="yes" class="btn" type="button" style="color:var(--danger)">지우기</button>
      <button id="no" class="btn" type="button">취소</button>
    </div>
    <button id="close" class="btn" type="button">닫기</button>
  </div>
</div>

  const [d, t] = v.split("T");
  return `${dotDate(d)} ${t || ""}`.trim();
}
function nowLocal() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

// ================= 임시 저장(이 기기 안) =================
const DB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((ok, no) => {
      const r = indexedDB.open("kcsi-mobile", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
    });
    return this.db;
  },
  async put(k, v) { try { const db = await this.open(); await new Promise((ok, no) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = ok; t.onerror = () => no(t.error); }); } catch (e) {} },
  async get(k) { try { const db = await this.open(); return await new Promise((ok) => { const r = db.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(undefined); }); } catch (e) { return undefined; } },
};
let saveTimer = null;
function saveNow() {
  clearTimeout(saveTimer); saveTimer = null;
  const { photos, docs, ...rest } = state;
  return DB.put("work2", { ...rest, photos: photos.map(({ id, blob, rot, desc }) => ({ id, blob, rot, desc })), docs: docs.map(({ id, blob, rot }) => ({ id, blob, rot })) });
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); updateDock(); }
document.addEventListener("visibilitychange", () => { if (document.hidden && saveTimer) saveNow(); });
window.addEventListener("pagehide", () => { if (saveTimer) saveNow(); });

function ageFromRrn(rrn) {
  const d = String(rrn || "").replace(/\D/g, "");
  if (d.length < 7) return "";
  const g = +d[6], cent = [1, 2, 5, 6].includes(g) ? 1900 : [3, 4, 7, 8].includes(g) ? 2000 : 1800;
  const y = cent + +d.slice(0, 2), m = +d.slice(2, 4), day = +d.slice(4, 6);
  if (!(m >= 1 && m <= 12 && day >= 1 && day <= 31)) return "";
  const base = new Date((state.check.t_found || state.date || today()).slice(0, 10) + "T00:00");
  let age = base.getFullYear() - y;
  if (base.getMonth() + 1 < m || (base.getMonth() + 1 === m && base.getDate() < day)) age--;
  return age >= 0 && age < 130 ? String(age) : "";
}

function agencyOf(org) {
  const o = (org || "").trim(); if (!o) return "";

  if (word) return word;
  const m = o.match(/^(.+?(?:지방경찰청|경찰청|청))/);
  return m ? m[1] : o.split(/\s+/)[0];
}

function openSig(id, title, onDone) {
  const strokes = state.sigs[id];
  let cur = null, closed = false;
  const box = document.createElement("div"); box.className = "skx";
  box.innerHTML = `<div class="tb"><span class="sigt">${esc(title)}</span><button type="button" data-act="clear">지우기</button>
      <button type="button" class="done" data-act="done">완료</button></div><div class="area"><canvas></canvas></div>`;
  document.body.appendChild(box);
  const cv = box.querySelector("canvas"), g = cv.getContext("2d"), area = box.querySelector(".area");
  try {
    const req = box.requestFullscreen || box.webkitRequestFullscreen;
    if (req) Promise.resolve(req.call(box)).then(() => screen.orientation && screen.orientation.lock && screen.orientation.lock("landscape").catch(() => {})).catch(() => {});
  } catch (e) {}
  let W = 0, H = 0;
  const paint = () => {
    g.fillStyle = "#fff"; g.fillRect(0, 0, W, H);
    g.strokeStyle = "#c9d0d6"; g.lineWidth = Math.max(1, W / 600); g.setLineDash([W / 80, W / 120]);
    g.beginPath(); g.moveTo(W * 0.06, H * 0.8); g.lineTo(W * 0.94, H * 0.8); g.stroke(); g.setLineDash([]);
    drawStrokes(g, strokes, W, H, "#111", Math.max(3, W / 140));
  };
  const fit = () => {
    const aw = area.clientWidth - 12, ah = area.clientHeight - 12, k = Math.min(aw / SIG.w, ah / SIG.h), dpr = window.devicePixelRatio || 1;
    cv.style.width = Math.floor(SIG.w * k) + "px"; cv.style.height = Math.floor(SIG.h * k) + "px";
    W = cv.width = Math.floor(SIG.w * k * dpr); H = cv.height = Math.floor(SIG.h * k * dpr);
    paint();
  };
  const pt = (e) => { const b = cv.getBoundingClientRect(); return [(e.clientX - b.left) / b.width, (e.clientY - b.top) / b.height]; };
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); cur = [pt(e)]; strokes.push(cur); paint(); });
  cv.addEventListener("pointermove", (e) => { if (!cur) return; cur.push(pt(e)); paint(); });
  const end = () => { if (cur) { if (cur.length < 2) cur.push([cur[0][0] + 0.002, cur[0][1]]); cur = null; paint(); saveSoon(); } };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  box.querySelector(".tb").addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.act === "clear") { strokes.length = 0; paint(); saveSoon(); }
    if (b.dataset.act === "done") close();
  });
  const onResize = () => fit();
  window.addEventListener("resize", onResize);
  history.pushState({ kcsi: route, sketch: 1 }, "", location.hash || "#" + route);   // 폰 뒤로 가기 = 완료
  const onPop = () => close(true);
  window.addEventListener("popstate", onPop);
  function close(fromPop) {
    if (closed) return; closed = true;
    window.removeEventListener("resize", onResize); window.removeEventListener("popstate", onPop);
    try { if (document.fullscreenElement) document.exitFullscreen(); if (screen.orientation && screen.orientation.unlock) screen.orientation.unlock(); } catch (e) {}
    box.remove(); saveSoon(); if (onDone) onDone();
    if (!fromPop && history.state && history.state.sketch) history.back();
  }
  requestAnimationFrame(fit);
}
async function setupPad(el) {
  const id = el.dataset.pad, f = fieldById(id), [x, y, w, h] = f.region;
  const cv = el.querySelector("canvas");
  cv.width = Math.round(w * S); cv.height = Math.round(h * S);
  const g = cv.getContext("2d");
  const im = await loadBg("c2");
  const strokes = state.pads[id];
  const redraw = () => {
    g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
    if (f.guide) g.drawImage(im, x * S, y * S, w * S, h * S, 0, 0, cv.width, cv.height);
    drawStrokes(g, strokes, cv.width, cv.height, f.guide ? "#d11a1a" : "#111");
  };
  redraw();
  let cur = null;
  const pt = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); cur = [pt(e)]; strokes.push(cur); });
  cv.addEventListener("pointermove", (e) => { if (!cur) return; cur.push(pt(e)); redraw(); });
  const end = () => { if (cur) { cur = null; saveSoon(); } };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  document.querySelector(`[data-undo="${id}"]`).addEventListener("click", () => { strokes.pop(); redraw(); saveSoon(); });
  document.querySelector(`[data-clear="${id}"]`).addEventListener("click", () => { strokes.length = 0; redraw(); saveSoon(); });
}
function drawStrokes(g, strokes, W, H, color = "#d11a1a", width = Math.max(2, W / 180)) {
  g.save(); g.strokeStyle = color; g.lineWidth = width; g.lineCap = g.lineJoin = "round";
  for (const s of strokes) {
    g.beginPath();
    s.forEach(([px, py], i) => (i ? g.lineTo(px * W, py * H) : g.moveTo(px * W, py * H)));
    if (s.length === 1) g.lineTo(s[0][0] * W + 0.5, s[0][1] * H + 0.5);
    g.stroke();
  }
  g.restore();
}

async function loadFile(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
  const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.9));
  return { id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()), blob, rot: 0, desc: "" };
}

async function docJpegs() {
  const out = [];
  for (const p of state.docs) {
    const bmp = await createImageBitmap(p.blob), r = p.rot % 180 !== 0;
    if (!p.rot) { out.push(p.blob); bmp.close && bmp.close(); continue; }
    const c = document.createElement("canvas"); c.width = r ? bmp.height : bmp.width; c.height = r ? bmp.width : bmp.height;
    const g = c.getContext("2d"); g.translate(c.width / 2, c.height / 2); g.rotate((p.rot * Math.PI) / 180);
    g.drawImage(bmp, -bmp.width / 2, -bmp.height / 2); bmp.close && bmp.close();
    out.push(await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.9)));

// PDF 쪽: 비율은 그대로, A4와 비율이 거의 같으면 여백 없이, 아니면 여백 1cm 안에 가운데
async function drawDocs() {
  const out = [], MM = PAGE.w / 210;
  for (const blob of await docJpegs()) {
    const { c, g } = newPage(), bmp = await createImageBitmap(blob);
    const a4 = PAGE.h / PAGE.w, ar = bmp.height / bmp.width;
    const m = Math.abs(ar - a4) / a4 > 0.06 ? 10 * MM : 0;
    const k = Math.min((PAGE.w - 2 * m) / bmp.width, (PAGE.h - 2 * m) / bmp.height);
    const w = bmp.width * k, h = bmp.height * k;
    g.drawImage(bmp, (PAGE.w - w) / 2, (PAGE.h - h) / 2, w, h); bmp.close && bmp.close();
    out.push(await toJpeg(c));
  }
  return out;
}

const PAGE = { w: 1653, h: 2337 };
const FONT = '"Malgun Gothic","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif';
const font = (pt, bold) => `${bold ? "700 " : ""}${(pt * S).toFixed(1)}px ${FONT}`;
function newPage() {
  const c = document.createElement("canvas"); c.width = PAGE.w; c.height = PAGE.h;

const toJpeg = (c) => new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.88));

// 글: 폭을 넘으면 글자를 줄이고(최소 6pt), 여러 줄 칸이면 줄바꿈
function fitLines(g, text, d) {
  const lines = [], max = d.lines || 1;
  let size = d.size || 9;
  const wrap = (sz) => {
    g.font = font(sz, d.bold); const out = [];
    for (const para of String(text).split("\n")) {
      let line = "";
      for (const ch of para) {
        if (g.measureText(line + ch).width > d.w * S && line) { out.push(line); line = ch; } else line += ch;
      }
      out.push(line);
    }
    return out;
  };
  let out = wrap(size);
  while (out.length > max && size > 6) { size -= 0.5; out = wrap(size); }
  if (max === 1) { g.font = font(size, d.bold); while (g.measureText(text).width > d.w * S && size > 5) { size -= 0.5; g.font = font(size, d.bold); } return { lines: [String(text)], size }; }
  return { lines: out.slice(0, max), size };
}
function drawText(g, text, d) {
  if (!String(text ?? "").trim()) return;
  if (d.cover) { g.fillStyle = "#fff"; g.fillRect(d.cover[0] * S, d.cover[1] * S, d.cover[2] * S, d.cover[3] * S); }
  const { lines, size } = fitLines(g, text, d);
  g.fillStyle = "#111"; g.font = font(size, d.bold); g.textBaseline = "alphabetic";
  g.textAlign = d.align || "left";
  const lh = d.lh || size * 1.25;
  const y0 = d.lines > 1 && !d.top ? d.y : d.y;   // 여러 줄 칸은 y가 첫 줄 위치
  lines.forEach((ln, i) => g.fillText(ln, d.x * S, (y0 + i * lh + size * 0.4) * S, d.w * S));
}
function drawCheck(g, x, y, s = CK.s) {
  // 네모 칸 안에 V 표시
  const cx = (x + s * 0.5) * S, cy = (y - 0.3) * S, k = s * 0.36 * S;
  g.save(); g.strokeStyle = "#0a0a0a"; g.lineWidth = Math.max(2.4, s * 0.17 * S); g.lineCap = g.lineJoin = "round";
  g.beginPath(); g.moveTo(cx - k * 0.95, cy - k * 0.05); g.lineTo(cx - k * 0.2, cy + k * 0.75); g.lineTo(cx + k * 1.05, cy - k * 0.95); g.stroke(); g.restore();
}
function drawCircle(g, x, y, s) {
  g.save(); g.strokeStyle = "#0a0a0a"; g.lineWidth = 2.6; g.beginPath(); g.ellipse(x * S, y * S, s * 0.75 * S, s * 0.62 * S, 0, 0, Math.PI * 2); g.stroke(); g.restore();
}

async function drawPhotos() {
  const out = [], per = state.perPage, MM = PAGE.w / 210;
  const total = Math.ceil(state.photos.length / per);
  for (let pi = 0; pi < total; pi++) {
    const { c, g } = newPage(), photos = state.photos.slice(pi * per, (pi + 1) * per);
    const L = 20 * MM, R = PAGE.w - 20 * MM, T = 25 * MM, B = PAGE.h - 15 * MM;   // 여백 위 2.5 · 아래 1.5 · 좌우 2.0 cm
    g.fillStyle = "#555"; g.font = `${(3.2 * MM).toFixed(1)}px ${FONT}`; g.textAlign = "right"; g.textBaseline = "alphabetic";
    g.fillText([state.caseName.trim(), dotDate(state.date)].filter(Boolean).join("  |  "), R, T - 5 * MM);
    g.textAlign = "center"; g.fillText(`${pi + 1} / ${total}`, PAGE.w / 2, PAGE.h - 8 * MM);
    const cols = per === 4 ? 2 : 1, gap = 8 * MM, capH = (per === 4 ? 12 : 14) * MM;
    const cellW = (R - L - gap * (cols - 1)) / cols, cellH = (B - T - gap) / 2;
    for (let j = 0; j < photos.length; j++) {
      const p = photos[j], cx = L + (j % cols) * (cellW + gap), cy = T + Math.floor(j / cols) * (cellH + gap);
      const bmp = await createImageBitmap(p.blob), rotated = p.rot % 180 !== 0;
      const iw = rotated ? bmp.height : bmp.width, ih = rotated ? bmp.width : bmp.height;
      const k = Math.min(cellW / iw, (cellH - capH) / ih), dw = iw * k, dh = ih * k;
      const dx = cx + (cellW - dw) / 2, dy = cy + (cellH - dh - capH) / 2;
      g.save(); g.translate(dx + dw / 2, dy + dh / 2); g.rotate((p.rot * Math.PI) / 180);
      g.drawImage(bmp, -(rotated ? dh : dw) / 2, -(rotated ? dw : dh) / 2, rotated ? dh : dw, rotated ? dw : dh);
      g.restore(); bmp.close && bmp.close();
      g.strokeStyle = "#9aa3ab"; g.lineWidth = 2; g.strokeRect(dx, dy, dw, dh);
      const ty = dy + dh + 8 * MM, n = pi * per + j + 1;
      g.textAlign = "center"; g.textBaseline = "alphabetic";
      // 사진 번호는 사진 왼쪽 아래, 설명은 사진 가운데 아래
      const label = `사진 ${n}`, desc = p.desc.trim();
      const lf = `700 ${((per === 4 ? 4.2 : 5.0) * MM).toFixed(1)}px ${FONT}`, df = `${((per === 4 ? 3.8 : 4.6) * MM).toFixed(1)}px ${FONT}`;
      g.textAlign = "left"; g.fillStyle = "#17324A"; g.font = lf; g.fillText(label, dx, ty);
      if (desc) {
        const lw = g.measureText(label).width + 3 * MM;
        g.font = df; g.fillStyle = "#111";
        const room = dw - lw, w = Math.min(g.measureText(desc).width, Math.max(room, dw * 0.5));
        let mid = dx + dw / 2;
        if (mid - w / 2 < dx + lw) mid = dx + lw + w / 2;      // 번호와 겹치면 오른쪽으로
        if (mid + w / 2 > dx + dw) mid = dx + dw - w / 2;
        g.textAlign = "center"; g.fillText(desc, mid, ty, w);
      }
    }
    out.push(await toJpeg(c));
  }
  return out;
}

async function buildPdf(jpegs) {
  const enc = new TextEncoder(), parts = [], offsets = []; let size = 0;
  const push = (x) => { const b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); size += b.length; };
  const W = 595.28, H = 841.89, n = jpegs.length, pageId = (i) => 4 + i * 3;
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const obj = (id, body) => { offsets[id] = size; push(`${id} 0 obj\n`); push(body); push("\nendobj\n"); };
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, `<< /Type /Pages /Count ${n} /Kids [${jpegs.map((_, i) => `${pageId(i)} 0 R`).join(" ")}] >>`);
  obj(3, `<< /Producer (KCSI Photo Editor Mobile ${VERSION}) /Creator (KCSI Photo Editor Mobile ${VERSION}) >>`);
  for (let i = 0; i < n; i++) {
    const id = pageId(i), bytes = new Uint8Array(await jpegs[i].arrayBuffer()), draw = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    obj(id, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${id + 2} 0 R >> >> /Contents ${id + 1} 0 R >>`);
    obj(id + 1, `<< /Length ${draw.length} >>\nstream\n${draw}\nendstream`);
    offsets[id + 2] = size;
    push(`${id + 2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${PAGE.w} /Height ${PAGE.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);
    push(bytes); push("\nendstream\nendobj\n");
  }
  const total = 4 + n * 3, xref = size;
  let table = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let id = 1; id < total; id++) table += `${String(offsets[id]).padStart(10, "0")} 00000 n \n`;
  push(table + `trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: "application/pdf" });
}

async function pickTarget(ext) {   // → {handle} | {name} | null(취소)
  const mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.userAgentData && navigator.userAgentData.mobile);

async function writeTarget(t, blob) {
  if (t.handle) {
    try { const w = await t.handle.createWritable(); await w.write(blob); await w.close(); return t.handle.name; }
    catch (e) { t = { name: t.handle.name }; }    // 쓰기가 막히면 다운로드로 저장
  }
  if (isIOS()) {   // 아이폰: 파일 그대로 공유 창(파일에 저장)으로, 안 되면 바로 내려받기
    const f = new File([blob], t.name, { type: blob.type || "application/octet-stream" });
    if (navigator.canShare && navigator.share && navigator.canShare({ files: [f] })) {
      try { await navigator.share({ files: [f] }); return t.name; }
      catch (e) { if (e && e.name === "AbortError") return null; }
    }
    blob = new Blob([blob], { type: "application/octet-stream" });
  }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = t.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  return t.name;
}

}

const hx = (s) => String(s ?? "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const HMM = (v) => Math.round(v * 7200 / 25.4);   // mm → HWPUNIT
function hwpxWriter() {
  const K = HWPX_KIT, I = K.ids, images = [], text = [];
  let uid = 1000000000;
  const id = () => ++uid;
  const p = (runs, para, br) => `<hp:p id="0" paraPrIDRef="${para}" styleIDRef="0" pageBreak="${br ? 1 : 0}" columnBreak="0" merged="0">${
    runs.map(([cp, c, xml]) => `<hp:run charPrIDRef="${cp}">${xml ? c + "<hp:t/>" : c ? `<hp:t>${hx(c)}</hp:t>` : "<hp:t/>"}</hp:run>`).join("") || '<hp:run charPrIDRef="0"><hp:t/></hp:run>'}</hp:p>`;
  const pic = (bytes, pw, ph, w, h) => {
    const n = images.length + 1, name = `image${n}`;
    images.push({ name, path: `BinData/${name}.jpg`, data: bytes });
    const ow = pw * 75, oh = ph * 75; w = Math.round(w); h = Math.round(h);
    return `<hp:pic id="${id()}" zOrder="${n}" numberingType="PICTURE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" href="" groupLevel="0" instid="${id()}" reverse="0">`
      + `<hp:offset x="0" y="0"/><hp:orgSz width="${ow}" height="${oh}"/><hp:curSz width="${w}" height="${h}"/><hp:flip horizontal="0" vertical="0"/><hp:rotationInfo angle="0"/>`
      + `<hp:renderingInfo><hc:transMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/><hc:scaMatrix e1="${(w / ow).toFixed(6)}" e2="0" e3="0" e4="0" e5="${(h / oh).toFixed(6)}" e6="0"/><hc:rotMatrix e1="1" e2="0" e3="0" e4="0" e5="1" e6="0"/></hp:renderingInfo>`
      + `<hp:imgRect><hc:pt0 x="0" y="0"/><hc:pt1 x="${ow}" y="0"/><hc:pt2 x="${ow}" y="${oh}"/><hc:pt3 x="0" y="${oh}"/></hp:imgRect>`
      + `<hp:imgClip left="0" right="${ow}" top="0" bottom="${oh}"/><hp:inMargin left="0" right="0" top="0" bottom="0"/>`
      + `<hc:img binaryItemIDRef="${name}" bright="0" contrast="0" effect="REAL_PIC" alpha="0"/><hp:effects/>`
      + `<hp:sz width="${w}" widthRelTo="ABSOLUTE" height="${h}" heightRelTo="ABSOLUTE" protect="0"/>`
      + `<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="PARA" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>`
      + `<hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:shapeComment>그림입니다.</hp:shapeComment></hp:pic>`;
  };
  // rows: [[높이, [{col, span, content, margin}]]]
  const table = (widths, rows) => {
    const tw = widths.reduce((a, b) => a + b, 0), th = rows.reduce((a, r) => a + r[0], 0);
    let x = `<hp:tbl id="${id()}" zOrder="0" numberingType="TABLE" textWrap="TOP_AND_BOTTOM" textFlow="BOTH_SIDES" lock="0" dropcapstyle="None" pageBreak="NONE" repeatHeader="0" rowCnt="${rows.length}" colCnt="${widths.length}" cellSpacing="0" borderFillIDRef="${I.bf}" noAdjust="1">`
      + `<hp:sz width="${tw}" widthRelTo="ABSOLUTE" height="${th}" heightRelTo="ABSOLUTE" protect="0"/>`
      + `<hp:pos treatAsChar="1" affectLSpacing="0" flowWithText="1" allowOverlap="0" holdAnchorAndSO="0" vertRelTo="PARA" horzRelTo="PARA" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>`
      + `<hp:outMargin left="0" right="0" top="0" bottom="0"/><hp:inMargin left="141" right="141" top="141" bottom="141"/>`;
    rows.forEach(([h, cells], r) => {
      x += "<hp:tr>";
      for (const c of cells) {
        const span = c.span || 1, w = widths.slice(c.col, c.col + span).reduce((a, b) => a + b, 0), m = c.margin ?? 141;
        x += `<hp:tc name="" header="0" hasMargin="1" protect="0" editable="0" dirty="0" borderFillIDRef="${I.bf}">`
          + `<hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="${c.valign || "CENTER"}" linkListIDRef="0" linkListNextIDRef="0" textWidth="0" textHeight="0" hasTextRef="0" hasNumRef="0">${c.content}</hp:subList>`
          + `<hp:cellAddr colAddr="${c.col}" rowAddr="${r}"/><hp:cellSpan colSpan="${span}" rowSpan="1"/><hp:cellSz width="${w}" height="${h}"/>`
          + `<hp:cellMargin left="${m}" right="${m}" top="${m}" bottom="${m}"/></hp:tc>`;
      }
      x += "</hp:tr>";
    });
    return x + "</hp:tbl>";
  };
  const HIDE = '<hp:ctrl><hp:pageHiding hideHeader="1" hideFooter="1" hideMasterPage="0" hideBorder="0" hideFill="0" hidePageNum="1"/></hp:ctrl>';
  const RESTART = '<hp:ctrl><hp:newNum num="1" numType="PAGE"><hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar="" supscript="0"/></hp:newNum></hp:ctrl>';
  return { K, I, images, text, p, pic, table, HIDE, RESTART, id };
}
async function bakedPhoto(blob, rot) {   // 회전을 반영한 JPEG와 크기
  const bmp = await createImageBitmap(blob), r = rot % 180 !== 0;
  const c = document.createElement("canvas"); c.width = r ? bmp.height : bmp.width; c.height = r ? bmp.width : bmp.height;
  const g = c.getContext("2d");
  if (rot) { g.translate(c.width / 2, c.height / 2); g.rotate((rot * Math.PI) / 180); g.drawImage(bmp, -bmp.width / 2, -bmp.height / 2); }
  else g.drawImage(bmp, 0, 0);
  bmp.close && bmp.close();
  const out = rot ? await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.9)) : blob;
  return { bytes: new Uint8Array(await out.arrayBuffer()), w: c.width, h: c.height };
}
async function buildHwpx(ch, bar) {
  const W = hwpxWriter(), { K, I, p, pic, table } = W, paras = [];
  // 1) 서류 쪽(점검표·유류물·인수인계서·문서 사진): 쪽 전체 그림, 머리말·쪽 번호 감춤
  let pages = [];
  if (ch.includes("check")) pages = pages.concat(await drawChecklist());
  if (ch.includes("items")) pages = pages.concat(await drawItems());
  if (ch.includes("hand")) pages = pages.concat(await drawHandover());
  if (ch.includes("docs")) pages = pages.concat(await drawDocs());
  bar.style.width = "45%";
  for (const b of pages) {
    const bytes = new Uint8Array(await b.arrayBuffer());
    let x = pic(bytes, PAGE.w, PAGE.h, K.pageW, K.pageH).replace('textWrap="TOP_AND_BOTTOM"', 'textWrap="BEHIND_TEXT"');
    x = x.replace(/<hp:pos [^>]*\/>/, '<hp:pos treatAsChar="0" affectLSpacing="0" flowWithText="0" allowOverlap="1" holdAnchorAndSO="0" vertRelTo="PAPER" horzRelTo="PAPER" vertAlign="TOP" horzAlign="LEFT" vertOffset="0" horzOffset="0"/>');
    paras.push(p([[0, W.HIDE + x, true]], I.pc, paras.length > 0));
  }
  // 2) 현장 사진: 쪽마다 테두리 없는 표(사진 / 사진 번호 · 설명)
  const per = state.perPage, photos = ch.includes("photos") ? state.photos : [], total = Math.ceil(photos.length / per);
  const two = per === 2, capH = HMM(two ? 12 : 10), gapH = HMM(8), photoH = Math.floor((K.bodyH - HMM(3) - gapH) / 2) - capH;
  const widths = two ? [HMM(28), K.bodyW - HMM(28)] : (() => { const lab = HMM(18), gap = HMM(8), d = Math.floor((K.bodyW - gap - 2 * lab) / 2); return [lab, d, K.bodyW - 2 * lab - 2 * d, lab, d]; })();
  const cols = two ? [0] : [0, 3], span = 2, boxW = widths[0] + widths[1] - HMM(1), boxH = photoH - HMM(2);
  const labCp = two ? I.lab2 : I.lab4, descCp = two ? I.desc2 : I.desc4;
  for (let pi = 0; pi < total; pi++) {
    const rows = [];
    for (let r = 0; r < 2; r++) {
      const list = cols.map((_, k) => photos[pi * per + r * cols.length + k]);
      if (!list.some(Boolean)) break;
      if (r) rows.push([gapH, [{ col: 0, span: widths.length, content: p([], I.pc) }]]);
      const prow = [], crow = [];
      for (let k = 0; k < cols.length; k++) {
        const ph = list[k], col = cols[k];
        let content = p([], I.pc);
        if (ph) {
          const b = await bakedPhoto(ph.blob, ph.rot), s = Math.min(boxW / b.w, boxH / b.h);
          content = p([[0, pic(b.bytes, b.w, b.h, b.w * s, b.h * s), true]], I.pc);
        }
        prow.push({ col, span, content, margin: 0 });
        const n = pi * per + r * cols.length + k + 1, desc = ph ? ph.desc.trim() : "";
        if (ph) W.text.push(`사진 ${n} ${desc}`);
        crow.push({ col, content: p(ph ? [[labCp, `사진 ${n}`]] : [], I.pl) }, { col: col + 1, content: p(desc ? [[descCp, desc]] : [], I.pc) });
        if (!two && k === 0) { prow.push({ col: 2, content: p([], I.pc) }); crow.push({ col: 2, content: p([], I.pc) }); }
      }
      rows.push([photoH, prow], [capH, crow]);
    }
    let first = p([[0, table(widths, rows), true]], I.pc, paras.length > 0);
    if (pi === 0 && pages.length) first = first.replace('<hp:run ', `<hp:run charPrIDRef="0">${W.RESTART}</hp:run><hp:run `);
    paras.push(first);
    bar.style.width = `${45 + Math.round(45 * (pi + 1) / total)}%`;
  }
  // 머리말(사건명 | 날짜, 오른쪽) · 꼬리말(쪽 / 전체, 가운데): 사진 쪽에만 보임
  const head = [state.caseName.trim(), dotDate(state.date)].filter(Boolean).join("  |  ");
  const sub = (h) => `<hp:subList id="" textDirection="HORIZONTAL" lineWrap="BREAK" vertAlign="BOTTOM" linkListIDRef="0" linkListNextIDRef="0" textWidth="${K.bodyW}" textHeight="${h}" hasTextRef="0" hasNumRef="0">`;
  const fld = (c, para) => `<hp:p id="0" paraPrIDRef="${para}" styleIDRef="0" pageBreak="0" columnBreak="0" merged="0"><hp:run charPrIDRef="${I.hf}">${c}</hp:run></hp:p>`;
  const pageNo = '<hp:ctrl><hp:autoNum num="1" numType="PAGE"><hp:autoNumFormat type="DIGIT" userChar="" prefixChar="" suffixChar="" supscript="0"/></hp:autoNum></hp:ctrl>';
  const hf = (head ? `<hp:run charPrIDRef="${I.hf}"><hp:ctrl><hp:header id="1" applyPageType="BOTH">${sub(HMM(8))}${fld(`<hp:t>${hx(head)}</hp:t>`, I.pr)}</hp:subList></hp:header></hp:ctrl><hp:t/></hp:run>` : "")
    + `<hp:run charPrIDRef="${I.hf}"><hp:ctrl><hp:footer id="1" applyPageType="BOTH">${sub(HMM(8))}${fld(`${pageNo}<hp:t> / ${total}</hp:t>`, I.pc)}</hp:subList></hp:footer></hp:ctrl><hp:t/></hp:run>`;
  let first = paras[0] || p([], I.pc);

  const section = K.secHead + first + paras.slice(1).join("") + "</hs:sec>";

}

// ================= 작업 파일(.kcsi) 저장·불러오기 =================
// .kcsi = ZIP(압축 없음): project.json(PC 프로그램 작업 형식) + 사진/001.jpg… + 첨부/점검표·유류물 쪽 그림
const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xffffffff; for (let i = 0; i < b.length; i++) c = CRC[(c ^ b[i]) & 0xff] ^ (c >>> 8); return (c ^ 0xffffffff) >>> 0; }
function makeZip(files) {                       // files: [{name, data: Uint8Array}]
  const enc = new TextEncoder(), parts = [], central = []; let off = 0;
  const d = new Date(), dt = ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1)), dd = (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate());
  for (const f of files) {
    const name = enc.encode(f.name), crc = crc32(f.data), n = f.data.length;
    const body = f.comp || f.data, m = f.comp ? 8 : 0, cn = body.length;   // f.comp: 미리 압축한 내용(deflate)
    const h = new DataView(new ArrayBuffer(30));
    h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, m, true);
    h.setUint16(10, dt, true); h.setUint16(12, dd, true); h.setUint32(14, crc, true); h.setUint32(18, cn, true); h.setUint32(22, n, true);
    h.setUint16(26, name.length, true); h.setUint16(28, 0, true);
    parts.push(new Uint8Array(h.buffer), name, body);
    const c = new DataView(new ArrayBuffer(46));
    c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true); c.setUint16(10, m, true);
    c.setUint16(12, dt, true); c.setUint16(14, dd, true); c.setUint32(16, crc, true); c.setUint32(20, cn, true); c.setUint32(24, n, true);
    c.setUint16(28, name.length, true); c.setUint32(42, off, true);
    central.push(new Uint8Array(c.buffer), name);
    off += 30 + name.length + cn;
  }
  const csize = central.reduce((a, b) => a + b.length, 0);
  const e = new DataView(new ArrayBuffer(22));
  e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true);
  e.setUint32(12, csize, true); e.setUint32(16, off, true);
  return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: "application/octet-stream" });
}
async function readZip(buf) {                    // 이름 → Uint8Array
  const v = new DataView(buf), u8 = new Uint8Array(buf), dec = new TextDecoder();
  let e = -1; for (let i = buf.byteLength - 22; i >= Math.max(0, buf.byteLength - 66000); i--) if (v.getUint32(i, true) === 0x06054b50) { e = i; break; }
  if (e < 0) throw new Error("zip");
  const count = v.getUint16(e + 10, true); let p = v.getUint32(e + 16, true); const out = {};
  for (let k = 0; k < count; k++) {
    if (v.getUint32(p, true) !== 0x02014b50) throw new Error("zip");
    const method = v.getUint16(p + 10, true), csz = v.getUint32(p + 20, true), nl = v.getUint16(p + 28, true), xl = v.getUint16(p + 30, true), cl = v.getUint16(p + 32, true), lo = v.getUint32(p + 42, true);
    const name = dec.decode(u8.subarray(p + 46, p + 46 + nl));
    const start = lo + 30 + v.getUint16(lo + 26, true) + v.getUint16(lo + 28, true);
    let data = u8.slice(start, start + csz);
    if (method === 8) data = new Uint8Array(await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
    else if (method !== 0) throw new Error("zip");
    out[name] = data; p += 46 + nl + xl + cl;
  }
  return out;
}
async function saveKcsi() {
  const c = counts();
  if (!c.check && !c.items && !c.hand && !c.docs && !c.photos) { showSheet("저장할 내용이 없습니다", "", "alert"); return; }
  const target = await pickTarget("kcsi"); if (!target) return;
  rememberUser();
  showSheet("작업 파일 만드는 중", "", "progress");
  const bar = $("prog").firstElementChild; bar.style.width = "10%";
  try {
    const enc = new TextEncoder(), files = [], photos = [], attach = [];
    const pad = (n) => String(n).padStart(3, "0");
    for (let i = 0; i < state.photos.length; i++) {
      const p = state.photos[i], f = `사진/${pad(i + 1)}.jpg`;
      files.push({ name: f, data: new Uint8Array(await p.blob.arrayBuffer()) });
      photos.push({ path: f, rel: f, number: String(i + 1), manual: false, desc: p.desc, included: true, rotation: p.rot,
        brightness: 100, sharpness: 100, annotations: [], children: [] });
    }
    bar.style.width = "40%";
    let pages = [];   // PC 문서에 '문서 사진 첨부'로 들어갈 점검표·유류물·인수인계서 쪽
    if (c.check) pages = pages.concat((await drawChecklist()).map((b, i) => ({ b, n: `첨부/점검목록표_${i + 1}.jpg` })));
    if (c.items) pages = pages.concat((await drawItems()).map((b, i) => ({ b, n: `첨부/유류물목록_${i + 1}.jpg` })));
    if (c.hand) pages = pages.concat((await drawHandover()).map((b, i) => ({ b, n: `첨부/의뢰증거물인수인계서_${i + 1}.jpg` })));
    if (c.docs) pages = pages.concat((await docJpegs()).map((b, i) => ({ b, n: `첨부/문서사진_${i + 1}.jpg`, doc: true })));
    for (const pg of pages) { files.push({ name: pg.n, data: new Uint8Array(await pg.b.arrayBuffer()) }); attach.push(pg.n); }
    bar.style.width = "80%";
    const { photos: _p, docs: _d, ...rest } = state;
    const project = {
      format: "kcsi-photo-project", version: 1, summary: "", quality: "표준", document_style: "표 없는 양식",
      photos_per_page: state.perPage, show_serial: true, margins_cm: { top: 2.5, bottom: 1.5, left: 2.0, right: 2.0 },
      checklist: attach, checklist_rel: attach, checklist_rotations: attach.map(() => 0), pdf_enabled: true,
      cover: { enabled: true, "제목": "현장사진 보고서", "소속": state.user.org.trim(), "사건명": state.caseName, "작성일": dotDate(state.date), "촬영자": rankName(state.user) },
      photos,
      mobile: { app: "KCSI Photo Editor Mobile", version: VERSION, state: rest, photos: state.photos.map((p, i) => ({ file: `사진/${pad(i + 1)}.jpg`, rot: p.rot, desc: p.desc })),
        docs: pages.filter((pg) => pg.doc).map((pg) => ({ file: pg.n })) },
    };
    files.unshift({ name: "project.json", data: enc.encode(JSON.stringify(project, null, 1)) });
    const name = await writeTarget(target, makeZip(files));
    if (name) showSheet("저장했습니다", name, "alert");
  } catch (e) { showSheet("저장하지 못했습니다", e.message, "alert"); }
}
$("openKcsi").addEventListener("change", async (ev) => {
  const f = ev.target.files[0]; ev.target.value = ""; if (!f) return;
  try {
    const z = await readZip(await f.arrayBuffer());
    const proj = JSON.parse(new TextDecoder().decode(z["project.json"]));
    let m = proj.mobile;
    if (!m || !m.state) {                        // PC 프로그램에서 '사진 포함 저장'한 파일: 사진·설명·회전만 가져옴
      const flat = []; const walk = (xs) => (xs || []).forEach((d) => { flat.push(d); walk(d.children); });
      walk(proj.photos);
      const list = flat.filter((d) => z[d.rel || d.path]);
      if (!list.length) throw new Error("photos");
      const c = proj.cover || {};
      m = { state: { caseName: c["사건명"] || "", perPage: proj.photos_per_page === 4 ? 4 : 2 },
        photos: list.map((d) => ({ file: d.rel || d.path, rot: d.rotation || 0, desc: (d.desc || "").replace(/\n/g, " ") })) };
    }
    state.photos.concat(state.docs).forEach((p) => p.url && URL.revokeObjectURL(p.url));
    const st = m.state;
    Object.assign(state, { caseName: st.caseName || "", date: st.date || today(), include: { check: true, photos: true, items: true, hand: true, docs: true, ...(st.include || {}) },
      check: st.check || {}, pads: { body: (st.pads || {}).body || [], sketch: fixSketch((st.pads || {}).sketch) }, perPage: st.perPage === 4 ? 4 : 2, items: st.items || [],
      confirm: { det_rank: "", det_name: "", sci_rank: "", sci_name: "", ...(st.confirm || {}) }, sigs: { det: [], sci: [], hf: [], ht: [], ...(st.sigs || {}) },
      hand: fixHand(st.hand) });
    state.photos = m.photos.filter((p) => z[p.file]).map((p, i) => ({ id: String(Date.now()) + i, blob: new Blob([z[p.file]], { type: "image/jpeg" }), rot: p.rot || 0, desc: p.desc || "" }));
    state.docs = (m.docs || []).filter((d) => z[d.file]).map((d, i) => ({ id: "d" + Date.now() + i, blob: new Blob([z[d.file]], { type: "image/jpeg" }), rot: 0 }));
    saveNow(); go("home");
    showSheet("작업을 불러왔습니다", f.name, "alert");
  } catch (e) {
    showSheet("열 수 없는 파일입니다", "사진이 포함된 .kcsi 파일만 열 수 있습니다.", "alert");
  }
});

// ================= 앱 설치(홈 화면) · 오프라인 =================
let installEvt = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; showInstall(); });
window.addEventListener("appinstalled", () => { installEvt = null; showInstall(); });
// 브라우저로 열었고 아직 설치하지 않았으면 처음에 팝업으로 설치 안내(안드로이드: 버튼 / 아이폰: 순서 안내)
let installClosed = false;
const flag = (k, v) => { try { if (v === undefined) return localStorage.getItem(k) === "1"; localStorage.setItem(k, "1"); } catch (e) { return false; } };
if (standalone()) flag("kcsi-installed", 1);                    // 바탕화면 아이콘으로 열림 = 설치됨
window.addEventListener("appinstalled", () => { flag("kcsi-installed", 1); installClosed = true; showInstall(); });
async function isInstalled() {
  if (standalone() || flag("kcsi-installed")) return true;
  try { if (navigator.getInstalledRelatedApps) return (await navigator.getInstalledRelatedApps()).length > 0; } catch (e) {}
  return false;
}
async function showInstall() {
  const pop = $("install"); if (!pop) return;
  const ua = navigator.userAgent;
  const inApp = /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|; wv\)/i.test(ua);
  const web = location.protocol === "https:" || location.hostname === "localhost";
  if (!web || installClosed || (await isInstalled()) || (flag("kcsi-install-never") && !inApp)) { pop.classList.add("hide"); return; }
  $("installIcon").src = document.querySelector('link[rel="apple-touch-icon"]').href;
  $("instInApp").classList.toggle("hide", !inApp);
  $("instAndroid").classList.toggle("hide", inApp);
  $("instIOS").classList.toggle("hide", inApp);
  $("instAndroid").classList.toggle("mine", !isIOS());
  $("instIOS").classList.toggle("mine", isIOS());
  $("installNever").classList.toggle("hide", inApp);
  $("installNever").parentElement.style.gridTemplateColumns = inApp ? "1fr" : "";
  pop.classList.remove("hide");
}
$("installBtn").addEventListener("click", async () => {
  if (installEvt) {                               // 크롬·삼성 인터넷: 폰의 설치 창을 바로 띄움
    installEvt.prompt();
    const r = await installEvt.userChoice.catch(() => ({}));
    installEvt = null;
    if (r && r.outcome === "accepted") { flag("kcsi-installed", 1); installClosed = true; showInstall(); }
    return;
  }
  // 브라우저가 바로 설치를 지원하지 않으면 메뉴 순서를 보여 줌
  const samsung = /SamsungBrowser/i.test(navigator.userAgent);
  const steps = isIOS() ? ["아이폰은 아래 ‘아이폰’ 순서대로 설치해 주세요."]
    : samsung ? ["아래쪽 메뉴(≡)를 누릅니다.", "‘현재 페이지 추가’를 누릅니다.", "‘홈 화면’을 고릅니다."]
    : ["오른쪽 위 메뉴(⋮)를 누릅니다.", "‘앱 설치’ 또는 ‘홈 화면에 추가’를 누릅니다."];
  $("instAndroidSteps").innerHTML = steps.map((t) => `<li>${esc(t)}</li>`).join("");
  $("instAndroidSteps").classList.remove("hide");
});
$("installLater").addEventListener("click", () => { installClosed = true; showInstall(); });
$("installNever").addEventListener("click", () => { flag("kcsi-install-never", 1); installClosed = true; showInstall(); });
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then((r) => r.update()).catch(() => {});
  // 새 버전이 설치되면 한 번만 자동으로 새로 열기(작성 중인 내용은 기기에 저장돼 있음)
  let reloaded = false;
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (!hadController || reloaded) return;
    reloaded = true; saveNow(); setTimeout(() => location.reload(), 300);
  });
}

// ================= 시작 =================
(async () => {

    const u = state.user; state.hand[state.hand.me] = { org: (u.org || "").trim(), rank: (u.rank || "").trim(), name: (u.name || "").trim() };
