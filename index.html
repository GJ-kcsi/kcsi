<style>
/* 첫 화면: 문서 3종 메뉴 → 각 입력 화면. 아래 고정 버튼으로 PDF. 모든 처리는 기기 안에서 */
:root{
  --bg:#eef1f4; --card:#ffffff; --ink:#1d2731; --muted:#66727d; --line:#d5dbe1;
  --navy:#1f3a5f; --navy-ink:#ffffff; --accent:#2f6fb2; --danger:#b23a3a; --chip:#e4eaf1; --on:#1f3a5f; --on-ink:#ffffff;
  --font:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171c; --card:#1b2229; --ink:#e6ebf0; --muted:#98a4af; --line:#2e3943;
  --navy:#2b4f7d; --navy-ink:#ffffff; --accent:#7fb2e6; --danger:#e07b7b; --chip:#25303a; --on:#3d6aa3; --on-ink:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12171c; --card:#1b2229; --ink:#e6ebf0; --muted:#98a4af; --line:#2e3943;
  --navy:#2b4f7d; --navy-ink:#ffffff; --accent:#7fb2e6; --danger:#e07b7b; --chip:#25303a; --on:#3d6aa3; --on-ink:#ffffff; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);-webkit-text-size-adjust:100%}
header{background:var(--navy);color:var(--navy-ink);padding-top:env(safe-area-inset-top,0px);position:sticky;top:0;z-index:5}
.bar{padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto}
.bar h1{font-size:18px;margin:0;letter-spacing:.02em;flex:1;min-width:0}
.back{background:transparent;border:1px solid rgba(255,255,255,.4);color:inherit;font:inherit;border-radius:8px;padding:4px 10px}
main{padding:12px max(16px,env(safe-area-inset-right,0px)) 130px max(16px,env(safe-area-inset-left,0px));max-width:760px;margin:0 auto;display:grid;gap:12px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:10px}
.panel h2{margin:0;font-size:15px;color:var(--navy)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .panel h2{color:var(--accent)}}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=datetime-local],input[type=number],textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;line-height:1.45}
input:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);color:var(--ink);font:inherit;padding:9px 0}
.seg button[aria-pressed=true]{background:var(--on);color:var(--on-ink);font-weight:700}
.q{display:grid;gap:6px}
.q > span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 12px}
.chip[aria-pressed=true]{background:var(--on);color:var(--on-ink);border-color:var(--on);font-weight:700}
.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:11px 12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn.primary{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.btn.small{padding:6px 10px;font-size:13px;white-space:nowrap;flex:none}
.btn:disabled{opacity:.5}
.btn:focus-visible,.icon:focus-visible,.chip:focus-visible,.seg button:focus-visible,.menu:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);font:inherit;cursor:pointer}
.menu b{font-size:16px;display:block}
.menu small{color:var(--muted)}
.menu .n{font-size:22px;font-weight:800;color:var(--navy);width:34px;text-align:center}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .menu .n{color:var(--accent)}}
.inc{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.inc input{width:20px;height:20px}
.empty{text-align:center;color:var(--muted);padding:24px 10px;border:1.5px dashed var(--line);border-radius:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;grid-template-columns:104px 1fr;gap:10px}
.thumb{width:104px;height:78px;border-radius:6px;background:var(--chip);object-fit:contain;display:block}
.meta{min-width:0;display:grid;gap:6px;align-content:start}
.top{display:flex;align-items:center;gap:6px}
.no{font-weight:700;color:var(--navy);white-space:nowrap}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .no{color:var(--accent)}}
.tools{margin-left:auto;display:flex;gap:4px}
.icon{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:15px;display:grid;place-items:center;padding:0}
.icon.del{color:var(--danger)}
.card .full{grid-column:1/-1}
.count{font-size:12px;color:var(--muted);text-align:right;margin-top:-6px}
.count.over{color:var(--danger);font-weight:700}
.pad{position:relative;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;touch-action:none}
.pad canvas{display:block;width:100%;height:auto}
.padtools{display:flex;gap:6px;flex-wrap:wrap}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;display:grid;gap:8px}
footer.dock{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);z-index:5;
  padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
.dock .info{font-size:13px;color:var(--muted);flex:1;min-width:0}
.sheet{position:fixed;inset:0;background:rgba(10,16,22,.5);display:grid;align-items:end;z-index:10}
.sheet .box{background:var(--card);border-radius:14px 14px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:grid;gap:10px;max-width:760px;width:100%;margin:0 auto}
.sheet h2{margin:0;font-size:17px}
.sheet p{margin:0;color:var(--muted);font-size:14px}
.progress{height:6px;background:var(--chip);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--accent)}
.brand{text-align:center;color:var(--muted);font-size:11px;line-height:1.6;padding:14px 0 4px;border-top:1px solid var(--line);margin-top:6px}
.brand .mark{display:flex;justify-content:center;align-items:baseline;gap:6px;margin-bottom:2px}
.brand .mark b{font-size:14px;color:var(--navy);letter-spacing:.02em}
.brand .mark span{font-size:11px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:0 7px}
.brand .org{font-size:12px;font-weight:700;color:var(--ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand .mark b{color:var(--accent)}}
.legal{font-size:11px;color:var(--muted);text-align:center}
.hide{display:none!important}
@media (max-width:420px){.row3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header><div class="bar">
  <button id="back" class="back hide" type="button">← 처음</button>
  <h1 id="title">KCSI Photo Editor</h1>
</div></header>

<main id="view"></main>

<footer class="dock"><div class="in">
  <div class="info" id="info"></div>
  <button id="make" class="btn primary" type="button">PDF 만들기</button>
</div></footer>

<input id="pick" type="file" accept="image/*" multiple hidden>

<div id="sheet" class="sheet hide" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="box">
    <h2 id="sheetTitle"></h2>
    <p id="sheetMsg"></p>
    <div class="progress" id="prog"><i></i></div>
    <div id="sheetBtns" class="two hide">
      <button id="share" class="btn primary" type="button">공유</button>
      <button id="save" class="btn" type="button">저장</button>
    </div>
    <div id="confirmBtns" class="two hide">
      <button id="yes" class="btn" type="button" style="color:var(--danger)">지우기</button>
      <button id="no" class="btn" type="button">취소</button>
    </div>
    <button id="close" class="btn" type="button">닫기</button>
  </div>
</div>

const VERSION = "v0.2";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// ================= 상태 =================
const state = {
  caseName: "", date: today(),
  include: { check: true, photos: true, items: true },
  check: {},                       // 점검 목록표 값
  pads: { body: [], sketch: [] },  // 손그림(정규화 좌표 선 목록)
  photos: [], perPage: 2,          // {id, blob, rot, desc}
  items: [], confirm: { det_rank: "", det_name: "", sci_rank: "", sci_name: "" },
};
function today() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function dotDate(v) { const [y, m, d] = (v || today()).split("-").map(Number); return `${y}. ${m}. ${d}.`; }
function dotDateTime(v) {
  if (!v) return "";
  const [d, t] = v.split("T");
  return `${dotDate(d)} ${t || ""}`.trim();
}
function nowLocal() {
  const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
  return d.toISOString().slice(0, 16);
}

// ================= 임시 저장(이 기기 안) =================
const DB = {
  db: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((ok, no) => {
      const r = indexedDB.open("kcsi-mobile", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error);
    });
    return this.db;
  },
  async put(k, v) { try { const db = await this.open(); await new Promise((ok, no) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = ok; t.onerror = () => no(t.error); }); } catch (e) {} },
  async get(k) { try { const db = await this.open(); return await new Promise((ok) => { const r = db.transaction("kv").objectStore("kv").get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ok(undefined); }); } catch (e) { return undefined; } },
};
let saveTimer = null;
function saveNow() {
  clearTimeout(saveTimer); saveTimer = null;
  const { photos, ...rest } = state;
  return DB.put("work2", { ...rest, photos: photos.map(({ id, blob, rot, desc }) => ({ id, blob, rot, desc })) });
}
function saveSoon() { clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 400); updateDock(); }

function ageFromRrn(rrn) {
  const d = String(rrn || "").replace(/\D/g, "");
  if (d.length < 7) return "";
  const g = +d[6], cent = [1, 2, 5, 6].includes(g) ? 1900 : [3, 4, 7, 8].includes(g) ? 2000 : 1800;
  const y = cent + +d.slice(0, 2), m = +d.slice(2, 4), day = +d.slice(4, 6);
  if (!(m >= 1 && m <= 12 && day >= 1 && day <= 31)) return "";
  const base = new Date((state.check.t_found || state.date || today()).slice(0, 10) + "T00:00");
  let age = base.getFullYear() - y;
  if (base.getMonth() + 1 < m || (base.getMonth() + 1 === m && base.getDate() < day)) age--;
  return age >= 0 && age < 130 ? String(age) : "";
}

// ---------- 손그림 칸 ----------
const S = 1653 / 595;                // 양식 이미지(200dpi) 픽셀 / pt
const bgImg = {};
function loadBg(key) {
  if (!bgImg[key]) bgImg[key] = new Promise((ok, no) => { const im = new Image(); im.onload = () => ok(im); im.onerror = no; im.src = BG[key]; });
  return bgImg[key];
}
async function setupPad(el) {
  const id = el.dataset.pad, f = fieldById(id), [x, y, w, h] = f.region;
  const cv = el.querySelector("canvas");
  cv.width = Math.round(w * S); cv.height = Math.round(h * S);
  const g = cv.getContext("2d");
  const im = await loadBg("c2");
  const strokes = state.pads[id];
  const redraw = () => {
    g.fillStyle = "#fff"; g.fillRect(0, 0, cv.width, cv.height);
    if (f.guide) g.drawImage(im, x * S, y * S, w * S, h * S, 0, 0, cv.width, cv.height);
    drawStrokes(g, strokes, cv.width, cv.height);
  };
  redraw();
  let cur = null;
  const pt = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height]; };
  cv.addEventListener("pointerdown", (e) => { cv.setPointerCapture(e.pointerId); cur = [pt(e)]; strokes.push(cur); });
  cv.addEventListener("pointermove", (e) => { if (!cur) return; cur.push(pt(e)); redraw(); });
  const end = () => { if (cur) { cur = null; saveSoon(); } };
  cv.addEventListener("pointerup", end); cv.addEventListener("pointercancel", end);
  document.querySelector(`[data-undo="${id}"]`).addEventListener("click", () => { strokes.pop(); redraw(); saveSoon(); });
  document.querySelector(`[data-clear="${id}"]`).addEventListener("click", () => { strokes.length = 0; redraw(); saveSoon(); });
}
function drawStrokes(g, strokes, W, H) {
  g.save(); g.strokeStyle = "#d11a1a"; g.lineWidth = Math.max(2, W / 180); g.lineCap = g.lineJoin = "round";
  for (const s of strokes) {
    g.beginPath();
    s.forEach(([px, py], i) => (i ? g.lineTo(px * W, py * H) : g.moveTo(px * W, py * H)));
    if (s.length === 1) g.lineTo(s[0][0] * W + 0.5, s[0][1] * H + 0.5);
    g.stroke();
  }
  g.restore();
}

async function loadFile(file) {
  const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
  const k = Math.min(1, 2000 / Math.max(bmp.width, bmp.height));
  const c = document.createElement("canvas");
  c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height); bmp.close && bmp.close();
  const blob = await new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.9));
  return { id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random()), blob, rot: 0, desc: "" };
}

  list.querySelectorAll("[data-i]").forEach((el) => el.addEventListener("input", () => { const [i, k] = el.dataset.i.split(":"); state.items[i][k] = el.value; saveSoon(); }));
  list.querySelectorAll("[data-id]").forEach((b) => b.addEventListener("click", () => { state.items.splice(+b.dataset.id, 1); renderItemList(); saveSoon(); }));
  list.querySelectorAll("[data-iu]").forEach((b) => b.addEventListener("click", () => { const i = +b.dataset.iu; [state.items[i - 1], state.items[i]] = [state.items[i], state.items[i - 1]]; renderItemList(); saveSoon(); }));
}

// ---------- 아래 버튼 ----------
function chosen() {
  const c = counts();
  return ["check", "items", "photos"].filter((k) => c[k] > 0 && state.include[k]);
}

function showSheet(title, msg, mode) {

// ================= PDF 그리기 =================
const PAGE = { w: 1653, h: 2337 };
const FONT = '"Malgun Gothic","Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo",sans-serif';
const font = (pt, bold) => `${bold ? "700 " : ""}${(pt * S).toFixed(1)}px ${FONT}`;
function newPage() {
  const c = document.createElement("canvas"); c.width = PAGE.w; c.height = PAGE.h;
  const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height);
  return { c, g };
}
const toJpeg = (c) => new Promise((ok) => c.toBlob(ok, "image/jpeg", 0.88));

// 글: 폭을 넘으면 글자를 줄이고(최소 6pt), 여러 줄 칸이면 줄바꿈
function fitLines(g, text, d) {
  const lines = [], max = d.lines || 1;
  let size = d.size || 9;
  const wrap = (sz) => {
    g.font = font(sz, d.bold); const out = [];
    for (const para of String(text).split("\n")) {
      let line = "";
      for (const ch of para) {
        if (g.measureText(line + ch).width > d.w * S && line) { out.push(line); line = ch; } else line += ch;
      }
      out.push(line);
    }
    return out;
  };
  let out = wrap(size);
  while (out.length > max && size > 6) { size -= 0.5; out = wrap(size); }
  if (max === 1) { g.font = font(size, d.bold); while (g.measureText(text).width > d.w * S && size > 5) { size -= 0.5; g.font = font(size, d.bold); } return { lines: [String(text)], size }; }
  return { lines: out.slice(0, max), size };
}
function drawText(g, text, d) {
  if (!String(text ?? "").trim()) return;
  if (d.cover) { g.fillStyle = "#fff"; g.fillRect(d.cover[0] * S, d.cover[1] * S, d.cover[2] * S, d.cover[3] * S); }
  const { lines, size } = fitLines(g, text, d);
  g.fillStyle = "#111"; g.font = font(size, d.bold); g.textBaseline = "alphabetic";
  g.textAlign = d.align || "left";
  const lh = d.lh || size * 1.25;
  const y0 = d.lines > 1 && !d.top ? d.y : d.y;   // 여러 줄 칸은 y가 첫 줄 위치
  lines.forEach((ln, i) => g.fillText(ln, d.x * S, (y0 + i * lh + size * 0.4) * S, d.w * S));
}
function drawCheck(g, x, y, s = CK.s) {
  // 네모 칸 안에 V 표시
  const cx = (x + s * 0.5) * S, cy = (y - 0.3) * S, k = s * 0.36 * S;
  g.save(); g.strokeStyle = "#0a0a0a"; g.lineWidth = Math.max(2.4, s * 0.17 * S); g.lineCap = g.lineJoin = "round";
  g.beginPath(); g.moveTo(cx - k * 0.95, cy - k * 0.05); g.lineTo(cx - k * 0.2, cy + k * 0.75); g.lineTo(cx + k * 1.05, cy - k * 0.95); g.stroke(); g.restore();
}
function drawCircle(g, x, y, s) {
  g.save(); g.strokeStyle = "#0a0a0a"; g.lineWidth = 2.6; g.beginPath(); g.ellipse(x * S, y * S, s * 0.75 * S, s * 0.62 * S, 0, 0, Math.PI * 2); g.stroke(); g.restore();
}
async function drawChecklist() {
  const C = state.check, pages = [newPage(), newPage()];
  const [b1, b2] = await Promise.all([loadBg("c1"), loadBg("c2")]);
  pages[0].g.drawImage(b1, 0, 0, PAGE.w, PAGE.h); pages[1].g.drawImage(b2, 0, 0, PAGE.w, PAGE.h);
  const G = (p) => pages[p - 1].g;
  for (const sec of CHECK) for (const f of sec.fields) {
    const v = C[f.id];
    if (["t", "num", "area"].includes(f.type)) {
      if (f.box && String(v ?? "").trim()) drawCheck(G(f.box[0]), f.box[1], f.box[2]);
      if (f.d.always && f.d.cover) { const c = f.d.cover, g = G(f.d.p); g.fillStyle = "#fff"; g.fillRect(c[0] * S, c[1] * S, c[2] * S, c[3] * S); }
      drawText(G(f.d.p), String(v ?? "").trim() ? String(v).trim() + (f.d.suffix || "") : "", f.d);
    } else if (f.type === "dt") {
      if (v) drawText(G(f.d.p), dotDateTime(v) + (f.d.suffix || ""), f.d);
    } else if (f.type === "t3") {
      f.d.forEach((d, i) => drawText(G(d.p), C[f.id + "_" + i], d));
    } else if (f.type === "rrn") {
      const digits = String(v || "").replace(/\D/g, "");
      if (digits) {
        const g = G(1); g.fillStyle = "#111"; g.font = font(10); g.textAlign = "center"; g.textBaseline = "alphabetic";
        const put = (str, r, n) => [...str].forEach((ch, i) => g.fillText(ch, (r.x0 + (r.x1 - r.x0) / n * (i + 0.5)) * S, (r.y + 4) * S));
        put(digits.slice(0, 6), RRN.top, 6); put(digits.slice(6, 13), RRN.bottom, 7);
      }
    } else if (f.type === "c" || f.type === "m") {
      const sel = [].concat(v || []);
      for (const [o, p, x, y, s] of f.opts) if (sel.includes(o)) (f.circle ? drawCircle(G(p), x, y, s) : drawCheck(G(p), x, y, s));
      if (f.detail && detailOn(f, v)) {
        const dv = C[f.id + "_d"];
        const d = f.detail.d;
        const lift = (q) => ({ ...q, y: q.y + 2 });   // 네모 칸 줄의 글자 높이에 맞춤
        if (d.p) drawText(G(d.p), dv, lift(d));
        else { const which = sel.find((o) => d[o]); if (which) drawText(G(d[which].p), dv, lift(d[which])); }
      }
      if (f.id === "focus" && sel.includes("해당")) { /* 표시만 */ }
    } else if (f.type === "pad") {
      const [x, y, w, h] = f.region, strokes = state.pads[f.id];
      if (strokes.length) { const g = G(2); g.save(); g.translate(x * S, y * S); drawStrokes(g, strokes, w * S, h * S); g.restore(); }
    }
  }
  // 착의 체크: 칸 내용이 있으면 해당 □에 표시(위에서 처리)
  return Promise.all(pages.map((p) => toJpeg(p.c)));
}
async function drawItems() {
  const rows = state.items.filter((r) => Object.values(r).some((x) => String(x).trim()));
  const im = await loadBg("i1"), out = [];
  const cols = [[39.6, 105.3], [105.3, 180.9], [180.9, 254.7], [254.7, 363.6], [363.6, 459.9], [459.9, 555.3]];
  for (let start = 0; start < Math.max(rows.length, 1); start += 15) {
    const { c, g } = newPage(); g.drawImage(im, 0, 0, PAGE.w, PAGE.h);
    if (start) for (let j = 0; j < 15; j++) {   // 둘째 쪽부터는 연번을 16, 17 … 로 고쳐 씀
      const y = 156.96 + 36.8 * j;
      g.fillStyle = "#fff"; g.fillRect((cols[0][0] + 2) * S, (y - 12) * S, (cols[0][1] - cols[0][0] - 4) * S, 24 * S);
      drawText(g, String(start + j + 1), { x: 72.4, y, w: 40, size: 9.5, align: "center" });
    }
    rows.slice(start, start + 15).forEach((r, j) => {
      const y = 156.96 + 36.8 * j, n = start + j + 1;
      ["name", "qty", "place", "time", "lab"].forEach((k, i) => {
        const [x0, x1] = cols[i + 1];
        drawText(g, r[k], { x: (x0 + x1) / 2, y: y - (fitNeeds2(g, r[k], x1 - x0 - 6) ? 5 : 0), w: x1 - x0 - 6, size: 8.5, align: "center", lines: 2, lh: 10 });
      });
    });
    const cf = state.confirm;
    drawText(g, cf.det_rank, { x: 352, y: 705.4, w: 50, size: 9 }); drawText(g, cf.det_name, { x: 431, y: 705.4, w: 72, size: 9 });
    drawText(g, cf.sci_rank, { x: 352, y: 735.8, w: 50, size: 9 }); drawText(g, cf.sci_name, { x: 431, y: 735.8, w: 72, size: 9 });
    out.push(await toJpeg(c));
  }
  return out;
}
function fitNeeds2(g, text, w) { g.font = font(8.5); return g.measureText(String(text || "")).width > w * S; }
async function drawPhotos() {
  const out = [], per = state.perPage, MM = PAGE.w / 210;
  const total = Math.ceil(state.photos.length / per);
  for (let pi = 0; pi < total; pi++) {
    const { c, g } = newPage(), photos = state.photos.slice(pi * per, (pi + 1) * per);
    const L = 18 * MM, R = PAGE.w - 18 * MM, T = 16 * MM, B = PAGE.h - 14 * MM;
    g.fillStyle = "#555"; g.font = `${(3.2 * MM).toFixed(1)}px ${FONT}`; g.textAlign = "right"; g.textBaseline = "alphabetic";
    g.fillText([state.caseName.trim(), dotDate(state.date)].filter(Boolean).join("  |  "), R, T - 5 * MM);
    g.textAlign = "center"; g.fillText(`${pi + 1} / ${total}`, PAGE.w / 2, PAGE.h - 7 * MM);
    const cols = per === 4 ? 2 : 1, gap = 8 * MM, capH = (per === 4 ? 12 : 14) * MM;
    const cellW = (R - L - gap * (cols - 1)) / cols, cellH = (B - T - gap) / 2;
    for (let j = 0; j < photos.length; j++) {
      const p = photos[j], cx = L + (j % cols) * (cellW + gap), cy = T + Math.floor(j / cols) * (cellH + gap);
      const bmp = await createImageBitmap(p.blob), rotated = p.rot % 180 !== 0;
      const iw = rotated ? bmp.height : bmp.width, ih = rotated ? bmp.width : bmp.height;
      const k = Math.min(cellW / iw, (cellH - capH) / ih), dw = iw * k, dh = ih * k;
      const dx = cx + (cellW - dw) / 2, dy = cy + (cellH - dh - capH) / 2;
      g.save(); g.translate(dx + dw / 2, dy + dh / 2); g.rotate((p.rot * Math.PI) / 180);
      g.drawImage(bmp, -(rotated ? dh : dw) / 2, -(rotated ? dw : dh) / 2, rotated ? dh : dw, rotated ? dw : dh);
      g.restore(); bmp.close && bmp.close();
      g.strokeStyle = "#9aa3ab"; g.lineWidth = 2; g.strokeRect(dx, dy, dw, dh);
      const ty = dy + dh + 8 * MM, n = pi * per + j + 1;
      g.textAlign = "center"; g.textBaseline = "alphabetic";
      // 사진 번호는 사진 왼쪽 아래, 설명은 사진 가운데 아래
      const label = `사진 ${n}`, desc = p.desc.trim();
      const lf = `700 ${((per === 4 ? 4.2 : 5.0) * MM).toFixed(1)}px ${FONT}`, df = `${((per === 4 ? 3.8 : 4.6) * MM).toFixed(1)}px ${FONT}`;
      g.textAlign = "left"; g.fillStyle = "#17324A"; g.font = lf; g.fillText(label, dx, ty);
      if (desc) {
        const lw = g.measureText(label).width + 3 * MM;
        g.font = df; g.fillStyle = "#111";
        const room = dw - lw, w = Math.min(g.measureText(desc).width, Math.max(room, dw * 0.5));
        let mid = dx + dw / 2;
        if (mid - w / 2 < dx + lw) mid = dx + lw + w / 2;      // 번호와 겹치면 오른쪽으로
        if (mid + w / 2 > dx + dw) mid = dx + dw - w / 2;
        g.textAlign = "center"; g.fillText(desc, mid, ty, w);
      }
    }
    out.push(await toJpeg(c));
  }
  return out;
}

// 아주 작은 PDF 작성기: 쪽마다 JPEG 한 장
async function buildPdf(jpegs) {
  const enc = new TextEncoder(), parts = [], offsets = []; let size = 0;
  const push = (x) => { const b = typeof x === "string" ? enc.encode(x) : x; parts.push(b); size += b.length; };
  const W = 595.28, H = 841.89, n = jpegs.length, pageId = (i) => 4 + i * 3;
  push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
  const obj = (id, body) => { offsets[id] = size; push(`${id} 0 obj\n`); push(body); push("\nendobj\n"); };
  obj(1, "<< /Type /Catalog /Pages 2 0 R >>");
  obj(2, `<< /Type /Pages /Count ${n} /Kids [${jpegs.map((_, i) => `${pageId(i)} 0 R`).join(" ")}] >>`);
  obj(3, `<< /Producer (KCSI Photo Editor Mobile ${VERSION}) /Creator (KCSI Photo Editor Mobile ${VERSION}) >>`);
  for (let i = 0; i < n; i++) {
    const id = pageId(i), bytes = new Uint8Array(await jpegs[i].arrayBuffer()), draw = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
    obj(id, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${id + 2} 0 R >> >> /Contents ${id + 1} 0 R >>`);
    obj(id + 1, `<< /Length ${draw.length} >>\nstream\n${draw}\nendstream`);
    offsets[id + 2] = size;
    push(`${id + 2} 0 obj\n<< /Type /XObject /Subtype /Image /Width ${PAGE.w} /Height ${PAGE.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${bytes.length} >>\nstream\n`);
    push(bytes); push("\nendstream\nendobj\n");
  }
  const total = 4 + n * 3, xref = size;
  let table = `xref\n0 ${total}\n0000000000 65535 f \n`;
  for (let id = 1; id < total; id++) table += `${String(offsets[id]).padStart(10, "0")} 00000 n \n`;
  push(table + `trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(parts, { type: "application/pdf" });
}

let lastPdf = null;
$("make").addEventListener("click", async () => {
  const ch = chosen();
  const bad = photoTooLong();
  if (ch.includes("photos") && bad >= 0) { showSheet("설명이 너무 깁니다", `사진 ${bad + 1}의 설명을 ${LIMIT[state.perPage]}자 이내로 줄여 주세요.`, "alert"); return; }
  showSheet("PDF 만드는 중", "잠시만 기다려 주세요.", "progress");
  const bar = $("prog").firstElementChild; bar.style.width = "5%";
  try {
    let jpegs = [];
    if (ch.includes("check")) { jpegs = jpegs.concat(await drawChecklist()); bar.style.width = "35%"; }
    if (ch.includes("items")) { jpegs = jpegs.concat(await drawItems()); bar.style.width = "50%"; }
    if (ch.includes("photos")) { jpegs = jpegs.concat(await drawPhotos()); }
    bar.style.width = "100%";
    const name = `${(state.caseName.trim() || "현장사진").replace(/[\\/:*?"<>|]/g, "_")}.pdf`;
    lastPdf = new File([await buildPdf(jpegs)], name, { type: "application/pdf" });
    $("share").classList.toggle("hide", !(window.isSecureContext && navigator.canShare && navigator.canShare({ files: [lastPdf] })));
    showSheet("PDF를 만들었습니다", `${name} · ${jpegs.length}쪽 · ${(lastPdf.size / 1048576).toFixed(1)}MB`, "done");
  } catch (e) {
    showSheet("PDF를 만들지 못했습니다", "다시 시도해 주세요. (" + e.message + ")", "alert");
  }
});
$("share").addEventListener("click", async () => {
  try { await navigator.share({ files: [lastPdf] }); }
  catch (e) {
    if (e && e.name === "AbortError") return;      // 사용자가 공유 창을 닫음
    savePdf();                                     // 공유가 막힌 환경이면 저장으로 대신
    showSheet("공유 창을 열 수 없어 저장했습니다", "다운로드 폴더(내 파일 → 다운로드)에서 PDF를 찾아 보내 주세요.", "done");
    $("share").classList.add("hide");
  }
});
$("save").addEventListener("click", () => savePdf());
function savePdf() {
  const a = document.createElement("a"); a.href = URL.createObjectURL(lastPdf); a.download = lastPdf.name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

// ================= 앱 설치(홈 화면) · 오프라인 =================
let installEvt = null;
const standalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; showInstall(); });
window.addEventListener("appinstalled", () => { installEvt = null; showInstall(); });
function showInstall() {
  const box = $("install"); if (!box) return;
  const web = location.protocol === "https:" || location.hostname === "localhost";
  let msg = "";
  if (standalone() || !web) msg = "";
  else if (installEvt) msg = "바탕화면에 아이콘으로 설치하면 주소창 없이 앱처럼 열리고, 인터넷이 없어도 쓸 수 있습니다.";
  else if (isIOS()) msg = "사파리 아래쪽 공유 버튼(□↑)을 누르고 ‘홈 화면에 추가’를 고르면 앱처럼 설치됩니다.";
  else msg = "크롬 오른쪽 위 메뉴(⋮)에서 ‘앱 설치’ 또는 ‘홈 화면에 추가’를 고르면 앱처럼 설치됩니다.";
  box.classList.toggle("hide", !msg);
  $("installMsg").textContent = msg;
  $("installBtn").classList.toggle("hide", !installEvt);
  $("installBtn").onclick = async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; showInstall(); };
}
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

(async () => {
  const saved = await DB.get("work2");

    Object.assign(state, saved);
    state.pads = { body: [], sketch: [], ...(saved.pads || {}) };

  }
  applyDefaults();
  const r = location.hash.slice(1);

})();
