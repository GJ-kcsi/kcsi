<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#1f3a5f">
<title>KCSI Docs · 지문 채취</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{--bg:#eef1f4;--panel:#ffffff;--line:#d5dbe1;--tx:#1d2731;--sub:#66727d;--acc:#2f6fb2;--navy:#1f3a5f;--chip:#e4eaf1;--ok:#2e9d6a;--warn:#c27a12;--danger:#b23a3a;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#12171c;--panel:#1b2229;--line:#2e3943;--tx:#e6ebf0;--sub:#98a4af;--acc:#7fb2e6;--navy:#2b4f7d;--chip:#25303a;--ok:#3ccf8e;--warn:#ffb347;--danger:#e07b7b;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR","Noto Sans CJK KR",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
button:active{filter:brightness(.92)}
button.pri{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
button.on{background:var(--navy);border-color:var(--navy);color:#fff}
button.danger{color:var(--danger)}
input,select{font:inherit;color:var(--tx);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.screen{display:none;height:100%;flex-direction:column}
.screen.act{display:flex}
header{padding:10px 12px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;flex:none}
header h1{font-size:17px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .cnt{font-size:13px;color:rgba(255,255,255,.8)}
header button{padding:6px 12px;background:transparent;border:1px solid rgba(255,255,255,.45);color:#fff;border-radius:8px}
header button.pri{background:#fff;color:var(--navy);border-color:#fff}
header button.on{background:#fff;color:var(--navy);border-color:#fff;font-weight:700}
main{flex:1;overflow:auto;padding:12px 12px 20px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.info .full{grid-column:1/-1}
.linked{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.linked span{color:var(--sub)}
.linked .ttl2{grid-column:1/-1;font-size:12px;color:var(--acc);font-weight:600}
.card{width:100%;display:flex;align-items:center;gap:8px;text-align:left;padding:14px;margin-bottom:4px}
.card span:first-child{flex:1;font-size:15px}
.card .sub{color:var(--sub);font-size:13px}
.chev{font-size:22px;color:var(--sub)}
.menuMain{flex:1;display:flex;flex-direction:column;gap:12px;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
button.big{padding:22px 16px;font-size:20px;font-weight:600;border-radius:16px}
button.big.fill{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:26px;min-height:120px}
button.big.fill svg{color:var(--acc)}
.hands{font-size:52px;line-height:1}
.warnBox{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;border:2px solid #ff6b6b;background:rgba(255,80,80,.12);color:#ffb3b3;border-radius:16px;padding:26px 16px;font-size:24px;font-weight:700;text-align:center;line-height:1.6}
.info .grp{font-size:13px;font-weight:600;color:var(--acc);margin-top:10px;border-bottom:1px solid var(--line);padding-bottom:4px}
#slot1{flex:1;display:flex;justify-content:center;min-height:0;padding-top:8px}
#slot1 .slot{aspect-ratio:auto;width:78%;height:100%}
#slot1 .slot .lb{font-size:16px;padding:8px 0}
#slot1 .slot .no{font-size:18px}
#onePick .row{flex:1}
#onePick .row button{aspect-ratio:auto;height:100%;font-size:20px;font-weight:600}
#home main{display:flex;flex-direction:column;padding-bottom:10px}
#slots10{flex:1;display:flex;flex-direction:column;min-height:0}
#slots10 .row{flex:1;min-height:0}
#slots10 .slot{aspect-ratio:auto;height:100%;min-height:110px}
#slots10 .slot .lb{font-size:13px;padding:5px 0}
header button.back{padding:7px 12px}
#rvStage{flex:1;min-height:0;background:#111;display:flex;align-items:center;justify-content:center;padding:14px}
#rvImg{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
#review .bar button{padding:18px 6px;font-size:19px;font-weight:700}
.consent{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:16px;line-height:1.6;margin-bottom:8px}
.consent.sub2{font-size:13px;color:var(--sub)}
.signName{margin:14px 2px 8px;font-size:15px;color:var(--sub)}.signName b{color:var(--tx);margin-left:6px}
.padWrap{position:relative;background:#fff;border-radius:12px;height:220px;overflow:hidden}
#pad{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.padHint{position:absolute;right:14px;bottom:10px;color:#c33;font-size:18px;pointer-events:none}
.ok{color:var(--ok)}.no{color:var(--warn)}
.info label{font-size:12px;color:var(--sub);display:block;margin-bottom:3px}
.hand{font-size:13px;color:var(--sub);margin:14px 2px 6px}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.slot{aspect-ratio:3/4;background:var(--panel);border:1px solid var(--line);border-radius:10px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:0}
.slot.done{border-color:var(--ok)}
.slot img{width:100%;height:100%;object-fit:contain;background:#fff}
.slot .lb{position:absolute;left:0;right:0;bottom:0;font-size:11px;background:rgba(0,0,0,.65);padding:3px 0;text-align:center;color:#fff}
.slot .no{position:absolute;left:5px;top:3px;font-size:12px;font-weight:700;color:var(--acc);text-shadow:0 0 3px #000}
.slot .ex{position:absolute;right:4px;top:4px;font-size:10px;background:var(--warn);color:#000;border-radius:6px;padding:0 4px}
.slot .plus{font-size:26px;color:var(--sub)}
.bar{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--bg);flex:none}
.bar button{flex:1;padding:12px 6px}
#stage{flex:1;position:relative;background:#000;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#calBar{color:#fff;position:absolute;left:8px;right:8px;bottom:8px;display:none;gap:6px;align-items:center;background:rgba(15,20,24,.92);border:1px solid var(--line);border-radius:10px;padding:8px}
#calBar input{width:80px}
#calBar span{font-size:13px;color:#cfd6dc}
.tools{display:flex;gap:6px;padding:8px 10px;overflow-x:auto;border-top:1px solid var(--line);flex:none}
.tools button{flex:none;padding:8px 11px;font-size:14px}
.seg{display:flex;flex:none;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:8px 11px;font-size:14px}
.prev{display:flex;gap:12px;align-items:center;padding:8px 12px;height:168px;border-top:1px solid var(--line);flex:none}
#pv{height:100%;max-width:45%;object-fit:contain;background:#fff;border-radius:4px}
#pvInfo{font-size:12px;color:var(--sub);line-height:1.7}
#pvInfo b{color:var(--tx);font-weight:600}
#pvInfo .w{color:var(--warn)}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:20}
.sheet.act{display:flex}
.sheet .box{width:100%;background:var(--panel);border-radius:16px 16px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));display:grid;gap:8px}
.sheet .ttl{font-size:15px;font-weight:600;padding:0 4px 4px}
.sheet button{padding:13px}
#busy{position:fixed;inset:0;background:rgba(0,0,0,.6);color:#fff;display:none;align-items:center;justify-content:center;z-index:30;font-size:15px}
#busy.act{display:flex}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#263340;color:#fff;padding:9px 16px;border-radius:20px;font-size:14px;display:none;z-index:40}
#camStage{position:relative;flex:1;background:#000;overflow:hidden;color:#fff}
#camStage button{color:#fff}
#vid,#ov{position:absolute;inset:0;width:100%;height:100%}
#vid{object-fit:cover}
#camTop{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:10px 12px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
#camTop span{flex:1;font-size:16px;font-weight:600;text-shadow:0 0 4px #000}
#camTop button,#camBot button.sm{background:rgba(24,32,39,.8)}
#camBot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;padding:16px 22px calc(18px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.6))}
#camBot button.sm{width:68px;padding:9px 0}
#camDots{position:absolute;left:0;right:0;bottom:calc(118px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px}
#camDots span{font-size:12px;padding:3px 9px;border-radius:12px;background:rgba(0,0,0,.55);color:#aab4bc;border:1px solid rgba(255,255,255,.2)}
#camDots span.on{background:rgba(60,207,142,.85);color:#fff;border-color:#3ccf8e}
#shutter{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.4);background-clip:padding-box;padding:0}
#camTop{padding:14px 12px calc(14px) 12px!important;gap:8px!important}
#camTop span{font-size:20px!important}
#camTop button{font-size:19px;font-weight:700;padding:11px 15px;border-radius:12px;min-width:52px;background:rgba(0,0,0,.6)!important;border:1.5px solid rgba(255,255,255,.7)}
#camTop button.on{background:#fff!important;color:var(--navy)!important}
#camBot{padding:18px 18px calc(22px + env(safe-area-inset-bottom))!important}
#camBot button.sm{width:auto!important;min-width:104px;font-size:19px;font-weight:700;padding:16px 14px!important;border-radius:14px;background:rgba(0,0,0,.6)!important;border:1.5px solid rgba(255,255,255,.7)}
#camBot button.sm.on{background:#fff!important;color:var(--navy)!important}
#shutter{width:92px!important;height:92px!important;border-width:7px!important}
#camDots{bottom:calc(150px + env(safe-area-inset-bottom))!important;gap:10px!important}
#camDots span{font-size:16px!important;font-weight:700;padding:6px 14px!important;border-radius:16px!important}
#printArea{display:none}
@media print{
  @page{size:A4 landscape;margin:0}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block}
  #printArea img{width:297mm;height:210mm;display:block}
}
</style>
<style id="pageCss"></style>
</head>
<body>

<section id="menu" class="screen">
  <header><button class="back" id="toDocs">‹</button><h1>지문 채취</h1></header>
  <main class="menuMain">
    <button id="resume" class="card" style="display:none"><span id="resumeTxt"></span><span class="chev">›</span></button>
    <button class="big fill" id="mId"><svg viewBox="0 0 48 48" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M14 38c-3-4-4-9-4-14a14 14 0 0 1 28 0"/><path d="M19 41c-2-4-3-9-3-14a8 8 0 0 1 16 0c0 4 0 8-1 11"/><path d="M24 43c-1-5-2-10-2-16a2 2 0 0 1 4 0c0 6 1 10 3 14"/><path d="M38 31c0 3-1 6-2 8"/></svg><span>신원확인</span></button>
    <button class="big fill" id="mCrim"><svg viewBox="0 0 48 48" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M12 5h17l9 9v29H12z"/><path d="M29 5v9h9"/><path d="M18 22h14M18 28h14M18 34h9" stroke-linecap="round"/></svg><span>수사자료표</span></button>
  </main>
</section>

<section id="warn" class="screen">
  <header><button class="back" data-to="menu">‹</button><h1>수사자료표</h1></header>
  <main class="menuMain">
    <div class="warnBox"><svg viewBox="0 0 48 48" width="72" height="72" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"><path d="M24 6 44 41H4z"/><path d="M24 19v11M24 35v1" stroke-linecap="round"/></svg>미성년자인 경우<br>잉크로 10지를 채취하십시오.</div>
    <button class="big pri" id="warnOk">성인 · 계속</button>
    <button class="big" data-to="menu">취소</button>
  </main>
</section>

<section id="pick" class="screen">
  <header><button class="back" id="pickBack">‹</button><h1 id="pickTitle"></h1></header>
  <main class="menuMain">
    <button id="pResume" class="card" style="display:none"><span id="pResumeTxt"></span><span class="chev">›</span></button>
    <button class="big fill" id="pTen"><svg viewBox="0 0 50 24" width="130" height="62" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(24,0) scale(-1,1)"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></g><g transform="translate(26,0)"><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></g></svg><span>십지지문</span></button>
    <button class="big fill" id="pOne"><svg viewBox="0 0 24 24" width="62" height="62" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 14a8 8 0 0 1-8 8"/><path d="M18 11v-1a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V9a2 2 0 0 0-2-2a2 2 0 0 0-2 2v1"/><path d="M10 9.5V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v10"/><path d="M18 11a2 2 0 1 1 4 0v3a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg><span>일지 지문</span></button>
    <div id="onePick" style="display:none;flex:1;flex-direction:column">
      <div class="hand">왼손</div><div class="row" id="pickL"></div>
      <div class="hand">오른손</div><div class="row" id="pickR"></div>
    </div>
  </main>
</section>

<section id="home" class="screen">
  <header><button class="back" id="homeBack">‹</button><h1 id="homeTitle"></h1><span class="cnt" id="cnt"></span></header>
  <main>
    <button id="infoBtn" class="card" style="display:none"><span id="infoSum"></span><span class="chev">›</span></button>
    <button id="signBtn" class="card"><span id="signSum"></span><span class="chev">›</span></button>
    <div id="slots10">
      <div class="hand">왼손</div><div class="row" id="rowL"></div>
      <div class="hand">오른손</div><div class="row" id="rowR"></div>
    </div>
    <div id="slot1"></div>
  </main>
  <div class="bar">
    <button id="btnStart" class="pri" style="flex:2">촬영</button>
    <button id="btnOut">사진 저장</button>
  </div>
</section>

<section id="infoScr" class="screen">
  <header><button class="back" id="infoBack">‹</button><h1 id="infoTitle">인적사항</h1><button id="infoDone" class="pri">완료</button></header>
  <main>
    <div class="linked" id="linked"></div>
    <div class="info" id="infoId">
      <div class="full"><label>주소</label><input data-k="addr"></div>
      <div><label>등록기준지</label><input data-k="reg"></div>
      <div><label>직업</label><input data-k="job"></div>
      <div class="full"><label>의뢰사유</label><input data-k="reason"></div>
    </div>
    <div class="info" id="infoCrim">
      <div><label>국적</label><input data-k="c_nat"></div>
      <div><label>성별</label><select data-k="sex"><option value=""></option><option>남</option><option>여</option></select></div>
      <div><label>성명</label><input data-k="name"></div>
      <div class="tenOnly"><label>영문 성명</label><input data-k="c_eng"></div>
      <div class="full"><label>주민등록번호</label><input data-k="rrn" inputmode="numeric"></div>
      <div class="full"><label>주소</label><input data-k="addr"></div>
      <div class="full"><label>등록기준지</label><input data-k="reg"></div>
      <div class="tenOnly"><label>외국인신분</label><input data-k="c_alien"></div>
      <div class="tenOnly"><label>여권번호</label><input data-k="c_pass"></div>
      <div class="tenOnly full"><label>외국인 등록번호</label><input data-k="c_arn"></div>
      <div class="grp full">작성사항</div>
      <div><label>관서명</label><input data-k="c_office"></div>
      <div><label>년월일</label><input data-k="c_wdate" type="date"></div>
      <div><label>번호</label><input data-k="c_wno"></div>
      <div><label>죄명</label><input data-k="c_crime"></div>
      <div><label>사건번호</label><input data-k="c_case" placeholder="2026-000000"></div>
      <div><label>범죄·수사경력(건)</label><input data-k="c_hist" inputmode="numeric"></div>
      <div class="full"><label>비고</label><input data-k="c_note"></div>
      <div class="grp full">작성자</div>
      <div class="full"><label>소속</label><input data-k="c_dept" placeholder="○○과 ○○계"></div>
      <div><label>계급(직급)</label><input data-k="c_rank"></div>
      <div><label>성명</label><input data-k="c_writer"></div>
      <div class="grp full">확인관</div>
      <div><label>계급(직급)</label><input data-k="c_crank"></div>
      <div><label>성명</label><input data-k="c_checker"></div>
      <div class="oneOnly full"><label>특이사항</label><input data-k="c_special"></div>
    </div>
  </main>
</section>

<section id="sign" class="screen">
  <header><button class="back" id="signBack">‹</button><h1>채취 동의</h1><button id="signDone" class="pri">완료</button></header>
  <main>
    <div class="consent">본인은 신원확인 내용을 고지받았고, 지문채취에 동의합니다.</div>
    <div class="consent sub2">수사기관은 정확한 신원확인을 위해 「형의 실효 등에 관한 법률」 제2조 및 제5조 등에 따라 지문을 채취하고 있으며, 채취된 지문은 신원확인, 범죄·수사경력자료 조회 및 관리 등에 사용됩니다.</div>
    <div class="signName">성명 <b id="signNm"></b></div>
    <div class="padWrap"><canvas id="pad"></canvas><span class="padHint">(인)</span></div>
    <div style="display:flex;gap:8px;margin-top:10px"><button id="padClear" style="flex:1">지우기</button></div>
  </main>
</section>

<section id="review" class="screen">
  <header><h1 id="rvTitle"></h1><button id="rvEnh">융선 강조</button></header>
  <div id="rvStage"><canvas id="rvImg"></canvas></div>
  <div class="bar">
    <button id="rvRetake" style="flex:1">다시 촬영</button>
    <button id="rvKeep" class="pri" style="flex:1.4">저장</button>
  </div>
</section>

<section id="ed" class="screen">
  <header><button id="edDone">‹</button><h1 id="edTitle"></h1><button id="edNext" class="pri">다음 ▶</button></header>
  <div id="stage">
    <canvas id="cv"></canvas>
    <div id="calBar"><span>길이</span><input id="calMm" type="number" inputmode="decimal" value="10" step="0.5"><span>mm</span><button id="calOk" class="pri">적용</button><button id="calNo">취소</button></div>
  </div>

const RH=44,HR=26;

    x.strokeStyle='#ffde3f';x.fillStyle='#ffde3f';x.lineWidth=2;

    if(P.length===2){x.beginPath();x.moveTo(P[0][0],P[0][1]);x.lineTo(P[1][0],P[1][1]);x.stroke()}
    for(const [X,Y] of P){x.beginPath();x.arc(X,Y,6,0,Math.PI*2);x.stroke();x.beginPath();x.moveTo(X-12,Y);x.lineTo(X+12,Y);x.moveTo(X,Y-12);x.lineTo(X,Y+12);x.stroke()}

const ptr=new Map();let drag=null;
function pos(e){const r=cv.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}

    drag={t:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),s0:V.s,ix:(m.x-V.tx)/V.s,iy:(m.y-V.ty)/V.s};return}

    if(k<0){if(E.calPts.length>=2)E.calPts=[];E.calPts.push(ip);k=E.calPts.length-1;added=true}

cv.addEventListener('pointermove',e=>{

  return c;
}

$('btnPng').onclick=async()=>{closeOut();
  try{const r=await sheetBlob();if(!r){toast('채취한 지문이 없습니다');return}download(r.blob,`${baseName()}_${docName().split(' (')[0].replace(/\s/g,'')}.png`)}
  catch(e){toast('출력 실패')}finally{busy(false)}
};
$('btnPrint').onclick=async()=>{closeOut();
  try{
    const r=await sheetBlob();if(!r){toast('채취한 지문이 없습니다');return}
    const img=$('printImg');if(img.src)URL.revokeObjectURL(img.src);img.src=URL.createObjectURL(r.blob);
    $('pageCss').textContent=r.land?'@media print{@page{size:A4 landscape;margin:0}#printArea img{width:297mm;height:210mm}}':'@media print{@page{size:A4 portrait;margin:0}#printArea img{width:210mm;height:297mm}}';
    await img.decode().catch(()=>{});busy(false);setTimeout(()=>window.print(),100);
  }catch(e){toast('출력 실패')}finally{busy(false)}
};
$('btnZip').onclick=async()=>{closeOut();
  try{
    const P0=await processAll();if(!Object.keys(P0).length){toast('채취한 지문이 없습니다');return}const r={P:P0};
    busy(true,'묶는 중…');
    const files=[],log=[],I=INFO(),u8=async b=>new Uint8Array(await b.arrayBuffer());
    log.push(`${S.kind==='one'?'일지':'십지'}지문 채취 처리기록`,'',`사건번호: ${(S.mode==='crim'?I.c_case:I.caseNo)||''}`,`성명: ${I.name||''}`,`채취일시: ${(I.date||'').replace('T',' ')}`,`채취장소: ${I.place||''}`,`채취자: ${I.taker||''} / ${I.org||''}`,`기록 생성: ${new Date().toLocaleString('ko-KR')}`,'');
    for(const n of req()){
      const f=S.f[n];if(!f)continue;const q=r.P[n],pre=`${pad(n)}_${FN[n]}`;
      const ob=await u8(f.orig),on=`원본/${pre}_원본.${extOf(f.orig)}`;files.push({name:on,data:ob});
      log.push(`[${n}] ${FN[n]}`,`  원본: ${on} (${f.name||'촬영'}, ${q.src[0]}×${q.src[1]}px)`,`  원본 SHA-256: ${await sha256(f.orig)}`);
      (f.extras||[]).forEach((x,i)=>files.push({name:`추가사진/${pre}_추가${i+1}.${extOf(x)}`,data:null,blob:x}));
      {const bm=await decode(f.orig);
        for(const fl of [false,true]){const c=scaledPhoto(bm,fl,q.ppmmO,q.R.mode);
          files.push({name:fl?`좌우반전/${pre}_좌우반전_스케일.jpg`:`원본/${pre}_원본_스케일.jpg`,data:await u8(await new Promise(rs=>c.toBlob(rs,'image/jpeg',0.95)))})}
        if(bm.close)bm.close()}
      const pb=await pngWithDpi(q.c,q.R.ppi);files.push({name:`지문/${pre}_${Math.round(q.R.ppi)}ppi.png`,data:await u8(pb)});
      if(S.zipEnh!==false){busy(true,`융선 강조 중… ${n}`);await new Promise(r=>setTimeout(r,10));files.push({name:`융선강조/${pre}_융선강조_${Math.round(q.R.ppi)}ppi.png`,data:await u8(await pngWithDpi(enhanceCanvas(q.c,q.R.ppi),q.R.ppi))});busy(true,'묶는 중…')}
      files.push({name:`AFIS/${pre}_500ppi_600x600.png`,data:await u8(await pngWithDpi(afisCanvas(q.c5||q.c,q.R5),500))});
      log.push(`  처리: ${[q.o.flip?'좌우반전':'',q.o.inv?'명암반전':'',q.o.curve?'곡면보정(원통 ±70°)':''].filter(Boolean).join(', ')||'없음'} / 톤: ${TONEN[q.o.mode||'raw']}`,
        `  배율: ${({ruler:'자 보정',ridge:`융선 간격 자동 (평균 ${RIDGE_MM}mm 가정, 오차 약 ±15%)`,width:'추정 (손가락 폭 16mm 가정)'})[q.R.mode]} — ${q.R.ppmm.toFixed(2)} px/mm (작업 영상 기준)`,
        `  출력: ${q.R.ow}×${q.R.oh}px, ${q.R.wmm.toFixed(1)}×${q.R.hmm.toFixed(1)}mm, ${Math.round(q.R.ppi)}ppi`,
        `  추가 사진: ${(f.extras||[]).length}장`,'');
    }
    for(const f of files)if(!f.data&&f.blob)f.data=await u8(f.blob);
    if(S.mode==='crim'){log.push(`채취 동의 서명: ${S.sign?'있음 ('+new Date(S.signAt).toLocaleString('ko-KR')+')':'없음'}`);if(S.sign)files.push({name:'채취동의서명.png',data:await u8(await (await fetch(S.sign)).blob())})}
    files.push({name:'처리기록.txt',data:new TextEncoder().encode('﻿'+log.join('\r\n'))});
    download(makeZip(files),`${baseName()}_${S.kind==='one'?'일지':'십지'}지문.zip`);
  }catch(e){toast('저장 실패')}finally{busy(false)}
};
